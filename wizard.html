    { upTo: 75960, rate: 0.10 }, { upTo: 108720, rate: 0.14 }, { upTo: 174960, rate: 0.20 },
    { upTo: 243120, rate: 0.31 }, { upTo: 505920, rate: 0.35 }, { upTo: 663240, rate: 0.47 },
    { upTo: Infinity, rate: 0.50 },
  ], creditPoint: 2616, verified: false },
};
function getTaxTable(year) {
  return TAX_TABLES_BY_YEAR[year] || TAX_TABLES_BY_YEAR['2025'];
}

function calcTaxOnIncome(income, year) {
  const table = getTaxTable(year);
  let tax = 0;
  let lastCap = 0;
  for (const b of table.brackets) {
    if (income <= lastCap) break;
    const taxable = Math.min(income, b.upTo) - lastCap;
    tax += taxable * b.rate;
    lastCap = b.upTo;
  }
  return tax;
}

// --- ניירות ערך / אישורי 867: שיעורי המס הקבועים כפי שמופיעים באישורי הבנקים ---
const CAP_GAINS_RATES = [0, 15, 20, 25, 35];
const DIVIDEND_RATES = [0, 4, 15, 20, 23, 25];
const INTEREST_RATES = [0, 10, 15, 20, 23, 25, 35];

function num(v) {
  const n = parseFloat(v);
  return isNaN(n) ? 0 : n;
}

function emptyRateMap(rates) {
  const o = {};
  rates.forEach((r) => { o[r] = ''; });
  return o;
}

let __certIdSeq = 0;
function emptyCertificate() {
  __certIdSeq += 1;
  return {
    id: 'cert_' + Date.now() + '_' + __certIdSeq,
    bankName: '',
    // סניף/מספר חשבון — נדרשים לסעיף ב' בנספח ג (1322), "פרטי החשבונות מהם נוכה
    // מס במקור" (שם המנכה/מספר הסניף/מספר חשבון). מודפסים בכותרת כל טופס 867
    // ("בנק X סניף Y חשבון Z") ולכן ננסה לחלץ אוטומטית מהעלאת הקובץ; ניתנים גם
    // למילוי/תיקון ידני.
    branchCode: '',
    accountNumber: '',
    owner: 'registered', // 'registered' | 'spouse' | 'split'
    capGains: emptyRateMap(CAP_GAINS_RATES),
    offsetLosses: '',
    capGainsWithheld: '',
    turnover: '', // מחזור מכירות כולל — קוד 256 (1301) / קוד 56 (1322)
    dividends: emptyRateMap(DIVIDEND_RATES),
    dividendForeignCredit: '',
    dividendWithheld: '',
    interest: emptyRateMap(INTEREST_RATES),
    interestForeignCredit: '',
    interestWithheld: '',
    sourceFileName: '',
    parseStatus: 'manual',
    parseNote: '',
  };
}

function sumRateMap(map) {
  return Object.values(map || {}).reduce((s, v) => s + num(v), 0);
}

function taxFromRateMap(map) {
  return Object.entries(map || {}).reduce((s, [rate, v]) => s + num(v) * Number(rate) / 100, 0);
}

function ownerShare(cert, owner) {
  if (cert.owner === owner) return 1;
  if (cert.owner === 'split') return 0.5;
  return 0;
}

// חישוב לפי מתכונת נספח ג לטופס הדוח השנתי (טופס 1322) ודברי ההסבר הרשמיים שלו:
// - סעיף 2א: לגבי יחיד שני"ע שבידיו לא נרשמו בספרי עסק ונוכה מהם מלוא המס — הנתונים
//   נלקחים ישירות מטופסי 867א+ב, לפי החלק היחסי של כל שותף בחשבון (ownerShare).
// - סעיף 10: הפסד הון שוטף מני"ע מקוזז תחילה כנגד רווח הון (בכל שיעור, "השיעור המיטיב"
//   קודם) — קיזוז זה מבוצע במאוחד על כל חשבונות/בנקים של אותו נישום ולא בנפרד לכל בנק,
//   בהתאם למבנה סעיף ג' בטופס 1322 שמאחד את הנתונים מכל טפסי 867 שצורפו. יתרת הפסד
//   שלא נוצלה כנגד רווח הון ניתנת לקיזוז גם כנגד הכנסת ריבית/דיבידנד מני"ע ובלבד ששיעור
//   המס החל עליהן אינו עולה על 25% ("טבלת עזר לקיזוז יתרת הפסד" שבטופס).
function calcSecuritiesForOwner(data, ownerKey) {
  const certs = (data.securities || []).filter((c) => ownerShare(c, ownerKey) > 0);

  const capGainsPooled = {};
  const dividendsPooled = {};
  const interestPooled = {};
  let lossPooled = 0, capGainsWithheldPooled = 0, turnoverPooled = 0;
  let dividendCreditPooled = 0, dividendWithheldPooled = 0;
  let interestCreditPooled = 0, interestWithheldPooled = 0;
  // הכנסת דיבידנד/ריבית ב-25% שמקורה בפועל בחו"ל — מחושבת רק מתוך אישורים שיש
  // להם זיכוי מס זר (dividendForeignCredit/interestForeignCredit > 0), ולא מכל
  // האישורים יחד (שכוללים גם דיבידנד/ריבית ישראליים ב-25%). נדרש למילוי שדה 462/
  // המקביל בנספח ד (טופס 1324) — שם הופיע בעבר בטעות סך כל הדיבידנד ב-25% מכל
  // המקורות (כולל ישראליים), במקום רק הסכום שמקורו בחו"ל.
  let foreignDividend25Pooled = 0, foreignInterest25Pooled = 0;

  certs.forEach((cert) => {
    const factor = ownerShare(cert, ownerKey);
    Object.keys(cert.capGains || {}).forEach((r) => { capGainsPooled[r] = (capGainsPooled[r] || 0) + num(cert.capGains[r]) * factor; });
    Object.keys(cert.dividends || {}).forEach((r) => { dividendsPooled[r] = (dividendsPooled[r] || 0) + num(cert.dividends[r]) * factor; });
    Object.keys(cert.interest || {}).forEach((r) => { interestPooled[r] = (interestPooled[r] || 0) + num(cert.interest[r]) * factor; });
    lossPooled += num(cert.offsetLosses) * factor;
    capGainsWithheldPooled += num(cert.capGainsWithheld) * factor;
    dividendCreditPooled += num(cert.dividendForeignCredit) * factor;
    dividendWithheldPooled += num(cert.dividendWithheld) * factor;
    interestCreditPooled += num(cert.interestForeignCredit) * factor;
    interestWithheldPooled += num(cert.interestWithheld) * factor;
    turnoverPooled += num(cert.turnover) * factor;
    if (num(cert.dividendForeignCredit) > 0) foreignDividend25Pooled += num((cert.dividends || {})['25']) * factor;
    if (num(cert.interestForeignCredit) > 0) foreignInterest25Pooled += num((cert.interest || {})['25']) * factor;
  });

  // 1) קיזוז ההפסד המאוחד כנגד רווחי הון מכל הבנקים יחד, מהשיעור הגבוה לנמוך
  let remainingLoss = lossPooled;
  const capGainsRates = Object.keys(capGainsPooled).map(Number).sort((a, b) => b - a);
  const capGainsNet = {};
  let capGainsGross = 0;
  capGainsRates.forEach((r) => {
    let g = capGainsPooled[r] || 0;
    capGainsGross += g;
    if (remainingLoss > 0) {
      const offset = Math.min(g, remainingLoss);
      g -= offset;
      remainingLoss -= offset;
    }
    capGainsNet[r] = g;
  });
  const capGainsTax = capGainsRates.reduce((s, r) => s + capGainsNet[r] * r / 100, 0);

  // 2) יתרת הפסד שלא נוצלה — כנגד דיבידנד מני"ע בשיעור שאינו עולה על 25%
  const dividendNet = Object.assign({}, dividendsPooled);
  Object.keys(dividendsPooled).map(Number).filter((r) => r <= 25).sort((a, b) => b - a).forEach((r) => {
    if (remainingLoss <= 0) return;
    const offset = Math.min(dividendNet[r] || 0, remainingLoss);
    dividendNet[r] = (dividendNet[r] || 0) - offset;
    remainingLoss -= offset;
  });
  const dividendGross = sumRateMap(dividendsPooled);
  const dividendTaxGross = taxFromRateMap(dividendNet);
  const dividendCredit = Math.min(dividendTaxGross, dividendCreditPooled);
  const dividendTax = dividendTaxGross - dividendCredit;

  // 3) יתרת הפסד שעדיין לא נוצלה — כנגד ריבית מני"ע בשיעור שאינו עולה על 25%
  const interestNet = Object.assign({}, interestPooled);
  Object.keys(interestPooled).map(Number).filter((r) => r <= 25).sort((a, b) => b - a).forEach((r) => {
    if (remainingLoss <= 0) return;
    const offset = Math.min(interestNet[r] || 0, remainingLoss);
    interestNet[r] = (interestNet[r] || 0) - offset;
    remainingLoss -= offset;
  });
  const interestGross = sumRateMap(interestPooled);
  const interestTaxGross = taxFromRateMap(interestNet);
  const interestCredit = Math.min(interestTaxGross, interestCreditPooled);
  const interestTax = interestTaxGross - interestCredit;

  const totalTax = capGainsTax + dividendTax + interestTax;
  const totalWithheld = capGainsWithheldPooled + dividendWithheldPooled + interestWithheldPooled;
  const totalIncome = capGainsGross + dividendGross + interestGross;
  return {
    totalTax, totalWithheld, totalIncome, refund: totalWithheld - totalTax,
    unusedLoss: Math.max(0, remainingLoss), turnover: turnoverPooled,
    // פירוט גולמי (לפני קיזוז) לפי שיעור — נדרש כדי לשבץ ערכים לשדות הספציפיים
    // בטופס 1301 (למשל 141/241 לדיבידנד 25%), לא רק לסך הכולל.
    dividendsByRate: dividendsPooled, interestByRate: interestPooled,
    // זיכוי מס זר ששולם בפועל (מוצג בנפרד כדי לשמש גם את נספח ד — טופס 1324).
    dividendForeignCredit: dividendCreditPooled, interestForeignCredit: interestCreditPooled,
    // הכנסת דיבידנד/ריבית ב-25% שמקורה בחו"ל בלבד (ראו הערה למעלה) — לשדה 462
    // (ומקבילו לריבית) בנספח ד.
    foreignDividendIncome25: foreignDividend25Pooled, foreignInterestIncome25: foreignInterest25Pooled,
    // רווח הון לפי שיעור — גולמי (לפני קיזוז הפסד) ונטו (אחרי קיזוז) — נדרש למילוי
    // סעיף ג בנספח ג (טופס 1322), שורות 1 ו-6.
    capGainsGrossByRate: capGainsPooled, capGainsNetByRate: capGainsNet,
    // דיבידנד/ריבית נטו (אחרי קיזוז הפסד שוטף/מועבר) לפי שיעור — ההפרש מהברוטו
    // (dividendsByRate-dividendNetByRate) הוא בדיוק "סכום ההפסד שקוזז כנגד הכנסה
    // מריבית/דיבידנד" הנדרש לשורה 2 בטבלת העזר ולתיבת ההעברה לשדות 1301 בנספח ג.
    dividendNetByRate: dividendNet, interestNetByRate: interestNet,
  };
}

function calcSalary(p, year) {
  const from106 = sumForm106(p.form106s);
  // הכנסה ממשכורת וקצבה חייבת ממוסות באותה מדרגות (בסכום המצטבר) — לצורך אומדן
  // ההחזר הן מחוברות יחד; הפילוח הנפרד (from106.salary מול from106.pension) נשמר
  // כדי שהמילוי האוטומטי של טופס 1301 ישבץ קצבה בשדה 258/272 ולא ב-172/158.
  const income = num(p.annualIncome) + from106.salary + from106.pension;
  const withheld = num(p.taxWithheld) + from106.withheld;
  const points = num(p.creditPoints);
  const table = getTaxTable(year);
  const grossTax = calcTaxOnIncome(income, year);
  const creditsValue = points * table.creditPoint;
  const owed = Math.max(0, grossTax - creditsValue);
  return { income, withheld, points, grossTax, creditsValue, owed, refund: withheld - owed, from106 };
}

function calcPersonRefund(data, ownerKey) {
  const p = data[ownerKey];
  const salary = calcSalary(p, data.taxYear);
  const securities = calcSecuritiesForOwner(data, ownerKey);
  return {
    salary,
    securities,
    points: salary.points,
    income: salary.income + securities.totalIncome,
    withheld: salary.withheld + securities.totalWithheld,
    owed: salary.owed + securities.totalTax,
    refund: salary.refund + securities.refund,
  };
}

function getRefundBreakdown(data) {
  const needsSpouse = data.form1301.reportBasis === 'both' && data.maritalStatus === 'married';
  const reg = calcPersonRefund(data, 'registered');
  const sp = needsSpouse ? calcPersonRefund(data, 'spouse') : null;
  const total = reg.refund + (sp ? sp.refund : 0);
  return { reg, sp, needsSpouse, total };
}

function fmtILS(n) {
  const v = Math.round(n || 0);
  return '₪' + v.toLocaleString('he-IL');
}
window.calcPersonRefund = calcPersonRefund;
window.getRefundBreakdown = getRefundBreakdown;
window.calcSecuritiesForOwner = calcSecuritiesForOwner;
window.emptyCertificate = emptyCertificate;
window.getTaxTable = getTaxTable;
window.fmtILS = fmtILS;

// ============================================================================
// חילוץ אוטומטי מקבצי אישור 867 (PDF) — קורא את הנתונים ישירות מהקובץ שהועלה
// ============================================================================
// אישור 867 הוא טופס אחיד שרשות המסים מחייבת את כל הבנקים להשתמש בו, כך
// שלמרות שהעיצוב הוויזואלי משתנה מבנק לבנק, כותרות השדות והמדורים זהות.
// המנוע קורא את הטקסט מה-PDF עם המיקום המרחבי (x,y) של כל פריט, משחזר שורות
// לפי קרבה ב-y, ואז מזהה שיעורי מס (%) ומספרים לפי קרבה ב-x לעמודה המתאימה.

const RATE_RE = /^(\d{1,3})%$/;
const NUM_RE = /^-?[\d,]+$/;
const HEBREW_LETTER_RE = /[֐-׿]/;

function pnum(s) {
  const n = parseFloat(String(s).replace(/,/g, ''));
  return isNaN(n) ? null : n;
}

// בטבלאות מונוספייס (כגון אישורי מזרחי) פריט הטקסט של תא לעיתים "נדבק" לקו הטבלה
// הסמוך (|) בלי רווח ביניהם — יש להסיר את התו הזה לפני בדיקת המספר/האחוז.
function cellText(it) {
  return it.text.trim().replace(/^\|+/, '').replace(/\|+$/, '').trim();
}

// חלק מקבצי PDF (בעיקר ישנים/ממערכות שכר) מציירים כל ספרה כפריט טקסט נפרד (Tj
// נפרד לכל תו) במקום מספר שלם אחד — כך ש"63,271" מגיע כשישה פריטים צמודים ("6",
// "3", ",", "2", "7", "1") ולא כפריט אחד. בלי איחוד, pick106Number/firstDataRow
// היו "רואות" ספרות בודדות בלבד ומחזירות ערך שגוי (הספרה הגדולה ביותר, לא המספר
// המלא). מאחדים כאן רק רצפי ספרות/פסיקים סמוכים מבחינה מרחבית (פער קטן בין סוף
// פריט אחד לתחילת הבא) — לא נוגעים במילים עבריות, כדי לא לפגוע בסדר קריאה RTL.
const NUMERIC_FRAGMENT_RE = /^-?[\d,]+$/;
function mergeNumericFragments(items) {
  const GAP_TOL = 3; // ביחידות PDF (בערך רוחב חלל דק) — פער גדול יותר נחשב רווח אמיתי בין תאים
  const out = [];
  for (const it of items) {
    const t = it.text.trim();
    const prev = out[out.length - 1];
    if (
      prev && NUMERIC_FRAGMENT_RE.test(t) && NUMERIC_FRAGMENT_RE.test(prev.text.trim()) &&
      (it.x - (prev.x + (prev.width || 0))) <= GAP_TOL
    ) {
      prev.text += it.text;
      prev.width = (it.x + (it.width || 0)) - prev.x;
    } else {
      out.push({ ...it });
    }
  }
  return out;
}

function rowsFromItems(items) {
  const arr = items.slice().sort((a, b) => b.y - a.y || a.x - b.x);
  const rows = [];
  const Y_TOL = 3;
  for (const it of arr) {
    let row = rows.find((r) => Math.abs(r.y - it.y) <= Y_TOL);
    if (!row) { row = { y: it.y, items: [] }; rows.push(row); }
    row.items.push(it);
  }
  rows.sort((a, b) => b.y - a.y);
  rows.forEach((r) => {
    r.items.sort((a, b) => a.x - b.x);
    r.items = mergeNumericFragments(r.items);
  });
  return rows;
}

function lineText(row) {
  return row.items.map((it) => it.text).join(' ');
}

function hasWords(text, words) {
  return words.every((w) => text.indexOf(w) !== -1);
}

// תיקון קידוד עברית שגוי — תופעה מוכרת בקבצי PDF ישנים/ממערכות שכר ישראליות (למשל
// חלק מאישורי חברות הביטוח): הטקסט העברי מוטבע בפונט עם מפת קידוד Windows-1255
// (עברית), אך מוצהר/נקרא כ-WinAnsi (Windows-1252, לטינית), כך שחילוץ הטקסט מפיק
// "ג'יבריש" של אותיות לטיניות עם סימנים דיאקריטיים (למשל "ò î åã" במקום "עמ וד").
// מאחר שבתחום 0xE0–0xFA שני הקידודים ממפים בתים שונים למשמעות שונה לגמרי, וקוד
// היוניקוד של כל תו לטיני "מוטעה" כזה שווה בדיוק לערך הבית המקורי (WinAnsi הוא
// זהות בתחום הזה) — ניתן "לתרגם" בחזרה: לוקחים את קוד היוניקוד (=קוד הבית),
// ומפרשים אותו מחדש לפי טבלת Windows-1255 כדי לקבל את האות העברית הנכונה.
const MISENCODED_HEBREW_MAP = {
  'à':'א', 'á':'ב', 'â':'ג', 'ã':'ד', 'ä':'ה',
  'å':'ו', 'æ':'ז', 'ç':'ח', 'è':'ט', 'é':'י',
  'ê':'ך', 'ë':'כ', 'ì':'ל', 'í':'ם', 'î':'מ',
  'ï':'ן', 'ð':'נ', 'ñ':'ס', 'ò':'ע', 'ó':'ף',
  'ô':'פ', 'õ':'ץ', 'ö':'צ', '÷':'ק', 'ø':'ר',
  'ù':'ש', 'ú':'ת',
};

// זיהוי: הרבה תווים לטיניים מוטעמים (התחום ש-MISENCODED_HEBREW_MAP מכסה) לעומת
// מעט/אין אותיות עבריות אמיתיות בטקסט — סימן שכל העמוד "נתקע" בקידוד השגוי.
function looksMisencodedHebrew(text) {
  let latinAccentedCount = 0, hebrewCount = 0;
  for (const ch of text) {
    const code = ch.codePointAt(0);
    if (code >= 0xE0 && code <= 0xFA) latinAccentedCount++;
    else if (code >= 0x0590 && code <= 0x05FF) hebrewCount++;
  }
  return latinAccentedCount > 8 && latinAccentedCount > hebrewCount * 3;
}

function remapMisencodedHebrewText(text) {
  let out = '';
  for (const ch of text) out += (MISENCODED_HEBREW_MAP[ch] || ch);
  return out;
}

async function extractDocRows(arrayBuffer) {
  const doc = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  const allRows = [];
  for (let p = 1; p <= doc.numPages; p++) {
    const page = await doc.getPage(p);
    const content = await page.getTextContent();
    let items = content.items
      .map((it) => ({ text: it.str, x: it.transform[4], y: it.transform[5], width: it.width || 0 }))
      .filter((it) => it.text && it.text.trim());
    const pageText = items.map((it) => it.text).join('');
    if (looksMisencodedHebrew(pageText)) {
      items = items.map((it) => ({ ...it, text: remapMisencodedHebrewText(it.text) }));
    }
    rowsFromItems(items).forEach((r) => allRows.push(r));
  }
  return allRows;
}

// אוסף כותרות שיעורי מס (%) משורה/שורות עוקבות; עוצר ברגע שמגיע לשורת נתונים אמיתית
function findRateHeaders(rows, startIdx, maxWindow) {
  const rates = {};
  let idx = startIdx;
  let scanned = 0;
  while (idx < rows.length && scanned < maxWindow) {
    const row = rows[idx];
    const pctItems = row.items.filter((it) => RATE_RE.test(cellText(it)));
    const numItems = row.items.filter((it) => cellText(it) !== '' && NUM_RE.test(cellText(it)));
    if (numItems.length > 0 && pctItems.length === 0 && Object.keys(rates).length > 0) break;
    pctItems.forEach((it) => { rates[Number(RATE_RE.exec(cellText(it))[1])] = it.x; });
    idx++;
    scanned++;
  }
  return { rates, nextIdx: idx };
}

function nearestRate(rates, x) {
  let best = null, bestDist = Infinity;
  Object.keys(rates).forEach((r) => {
    const d = Math.abs(rates[r] - x);
    if (d < bestDist) { bestDist = d; best = Number(r); }
  });
  return best;
}

function firstDataRow(rows, from, to) {
  for (let i = from; i < to && i < rows.length; i++) {
    const nums = rows[i].items.filter((it) => cellText(it) !== '' && NUM_RE.test(cellText(it)));
    if (nums.length) return { row: rows[i], idx: i };
  }
  return null;
}

// בטבלאות מונוספייס ערך יחיד לעיתים נדבק, יחד עם תו הטבלה |, לטקסט תווית שלם (למשל
// ")3( |60" או "580|040* שדה") — במקרה כזה אין פריט "נקי" שהוא כולו מספר, ולכן
// כגיבוי מחפשים את המופע הראשון של | ואחריו (רווח אופציונלי ואז) ספרות בכל השורה.
const PIPE_NUM_RE = /\|\s*([\d,]+)(?!\d)/;

function findScalarNumber(row, mustWords, excludeWords) {
  const text = lineText(row);
  if (!hasWords(text, mustWords)) return null;
  if ((excludeWords || []).some((w) => text.indexOf(w) !== -1)) return null;
  const it = row.items.find((x) => cellText(x) !== '' && cellText(x) !== '-' && NUM_RE.test(cellText(x)));
  if (it) return pnum(cellText(it));
  const m = PIPE_NUM_RE.exec(text);
  return m ? pnum(m[1]) : null;
}

function addRateValues(target, rows, headerRates, dataRow) {
  let any = false;
  dataRow.row.items.forEach((it) => {
    const t = cellText(it);
    if (t !== '' && NUM_RE.test(t)) {
      const r = nearestRate(headerRates, it.x);
      if (r != null) { target[r] = (target[r] || 0) + (pnum(t) || 0); any = true; }
    }
  });
  return any;
}

// מחלץ "בנק X סניף Y חשבון Z" מכותרת טופס 867 (למשל "בנק 12 סניף 754 חשבון
// 101177 אופנהיים יאיר..."). ה-"בנק" כאן מלווה במספר (קוד הבנק), בניגוד ל"בנק
// הפועלים בע"מ" שבו "בנק" מלווה בשם — לכן \d+ אחרי "בנק" מבדיל בין השניים.
function parseBankBranchAccount(rows) {
  const out = { bankCode: null, branchCode: null, accountNumber: null };
  for (const r of rows) {
    const t = lineText(r);
    // סדר "רגיל": "בנק X סניף Y חשבון Z". בחלק מהקבצים (למשל בנק הפועלים) הפריטים
    // בשורה מגיעים מ-pdf.js בסדר הפוך: "...Z חשבון Y סניף X בנק" — בודקים את שתי
    // הצורות.
    let m = t.match(/בנק\s+(\d+)\s+סניף\s+(\d+)(?:\s+חשבון\s+(\d+))?/);
    if (m) {
      out.bankCode = m[1]; out.branchCode = m[2]; if (m[3]) out.accountNumber = m[3];
      return out;
    }
    m = t.match(/(?:(\d+)\s+חשבון\s+)?(\d+)\s+סניף\s+(\d+)\s+בנק/);
    if (m) {
      out.accountNumber = m[1] || null; out.branchCode = m[2]; out.bankCode = m[3];
      return out;
    }
  }
  // צורה שלישית — טבלה מונוספייסית עם עמודות "בנק | מספר סניף | מספר חשבון"
  // (למשל בנק מזרחי טפחות): שורת כותרת נפרדת מהתווית, ומתחתיה שורת נתונים עם
  // מספרים מסתיימים ב-"|". מזהים את שורת הכותרת (מכילה גם "סניף" וגם "חשבון"),
  // ובשורה הבאה מתאימים כל מספר לעמודה הקרובה ביותר לפי מיקום x.
  for (let i = 0; i < rows.length - 1; i++) {
    const headerText = lineText(rows[i]);
    if (headerText.indexOf('סניף') === -1 || headerText.indexOf('חשבון') === -1) continue;
    const headerCols = [];
    rows[i].items.forEach((it) => {
      if (it.text.indexOf('סניף') !== -1) headerCols.push({ key: 'branchCode', x: it.x });
      else if (it.text.indexOf('בנק') !== -1) headerCols.push({ key: 'bankCode', x: it.x });
      else if (it.text.indexOf('חשבון') !== -1) headerCols.push({ key: 'accountNumber', x: it.x });
    });
    if (!headerCols.length) continue;
    const dataRow = rows[i + 1];
    const nums = dataRow.items.filter((it) => /^\d[\d,]*\|?$/.test(it.text.trim()));
    if (!nums.length) continue;
    nums.forEach((it) => {
      let best = null, bestDist = Infinity;
      headerCols.forEach((c) => { const d = Math.abs(c.x - it.x); if (d < bestDist) { bestDist = d; best = c; } });
      if (best) out[best.key] = it.text.replace(/[|,]/g, '').trim();
    });
    if (out.branchCode || out.accountNumber) return out;
  }
  return out;
}

function parse867Rows(rows) {
  const result = {
    bankName: '', found: false,
    capGains: {}, offsetLosses: null, capGainsWithheld: null, turnover: null,
    dividends: {}, dividendForeignCredit: null, dividendWithheld: null,
    interest: {}, interestForeignCredit: null, interestWithheld: null,
  };

  const bankIds = parseBankBranchAccount(rows);
  if (bankIds.branchCode) { result.branchCode = bankIds.branchCode; result.found = true; }
  if (bankIds.accountNumber) { result.accountNumber = bankIds.accountNumber; result.found = true; }

  for (const r of rows) {
    const t = lineText(r);
    if (t.indexOf('בע"מ') !== -1) {
      const m = t.match(new RegExp('([\\u0590-\\u05FF\'׳״]+(?:\\s+[\\u0590-\\u05FF\'׳״]+)*\\s+בע"מ)'));
      if (m) { result.bankName = m[1].trim(); break; }
    }
  }

  let section = null;
  let i = 0;
  while (i < rows.length) {
    const text = lineText(rows[i]);

    if (text.indexOf('נתוני הכנסות') !== -1 && text.indexOf('רווח הון') !== -1) {
      section = 'capgains';
      const { rates, nextIdx } = findRateHeaders(rows, i + 1, 6);
      const data = firstDataRow(rows, nextIdx, nextIdx + 6);
      if (data && addRateValues(result.capGains, rows, rates, data)) result.found = true;
      i = nextIdx;
      continue;
    }
    if (text.indexOf('דיבידנד') !== -1 && text.indexOf('חלוקת') !== -1) {
      section = 'dividend';
      const { rates, nextIdx } = findRateHeaders(rows, i + 1, 6);
      const data = firstDataRow(rows, nextIdx, nextIdx + 6);
      if (data && addRateValues(result.dividends, rows, rates, data)) result.found = true;
      i = nextIdx;
      continue;
    }
    if (text.indexOf('ריבית') !== -1 && text.indexOf('מניירות ערך') !== -1) {
      section = 'interest';
      const { rates, nextIdx } = findRateHeaders(rows, i + 1, 6);
      const data = firstDataRow(rows, nextIdx, nextIdx + 6);
      if (data && addRateValues(result.interest, rows, rates, data)) result.found = true;
      i = nextIdx;
      continue;
    }

    if (section === 'capgains') {
      if (hasWords(text, ['הפסדים', 'קיזוז']) && text.indexOf('שאינם') === -1) {
        const n = findScalarNumber(rows[i], ['הפסדים', 'קיזוז'], ['שאינם']);
        if (n != null) { result.offsetLosses = (result.offsetLosses || 0) + n; result.found = true; }
      }
      if (hasWords(text, ['מס', 'שנוכה', 'במקור'])) {
        const n = findScalarNumber(rows[i], ['מס', 'שנוכה', 'במקור'], []);
        if (n != null) { result.capGainsWithheld = n; result.found = true; }
      }
      // "מחזור מכירות" (קוד 256) — באישורי בנק מסוימים (למשל בנק הפועלים) המספר
      // עצמו יושב בשורה נפרדת מהתווית (התווית מתפצלת לכותרת + משפט הסבר ארוך על
      // פני כמה שורות, והמספר מוצג ביניהן בשורה נפרדת) — לכן אם אין מספר באותה
      // שורה כמו התווית, מחפשים בשורות הסמוכות (לפני/אחרי) שורה שהיא מספר בודד.
      // התווית עצמה עלולה להתאים ביותר משורה אחת (כותרת קצרה + משפט הסבר מלא),
      // ולכן result.turnover == null מונע ספירה כפולה של אותו מספר.
      if (hasWords(text, ['מחזור', 'מכירות']) && result.turnover == null) {
        let n = findScalarNumber(rows[i], ['מחזור', 'מכירות'], []);
        if (n == null) {
          for (let k = Math.max(0, i - 2); k <= Math.min(rows.length - 1, i + 4); k++) {
            const bareNums = rows[k].items.filter((it) => cellText(it) !== '' && NUM_RE.test(cellText(it)));
            if (bareNums.length === 1 && rows[k].items.length === 1) { n = pnum(cellText(bareNums[0])); break; }
          }
        }
        if (n != null) { result.turnover = n; result.found = true; }
      }
    }
    if (section === 'dividend') {
      if (hasWords(text, ['מס', 'ששולם', 'בחו']) && text.indexOf('שלא') === -1) {
        const n = findScalarNumber(rows[i], ['מס', 'ששולם', 'בחו'], ['שלא']);
        if (n != null) { result.dividendForeignCredit = n; result.found = true; }
      }
      if (hasWords(text, ['שנוכה', 'במקור']) && text.indexOf('דיבידנד') !== -1) {
        const n = findScalarNumber(rows[i], ['שנוכה', 'במקור'], []);
        if (n != null) { result.dividendWithheld = n; result.found = true; }
      }
    }
    if (section === 'interest') {
      if (hasWords(text, ['מס', 'ששולם', 'בחו']) && text.indexOf('שלא') === -1) {
        const n = findScalarNumber(rows[i], ['מס', 'ששולם', 'בחו'], ['שלא']);
        if (n != null) { result.interestForeignCredit = n; result.found = true; }
      }
      if (hasWords(text, ['שנוכה', 'במקור']) && (text.indexOf('ריבית') !== -1 || text.indexOf('ניכיון') !== -1 || text.indexOf('נכיון') !== -1)) {
        const n = findScalarNumber(rows[i], ['שנוכה', 'במקור'], []);
        if (n != null) { result.interestWithheld = n; result.found = true; }
      }
    }
    i++;
  }
  return result;
}

function rateMapToStrings(map) {
  const o = {};
  Object.keys(map || {}).forEach((r) => { o[r] = map[r] ? String(map[r]) : ''; });
  return o;
}

// הופך תוצאת פענוח לאובייקט "אישור בנק" מלא, על גבי תבנית ריקה, ומסמן שדות שחולצו אוטומטית
function certificateFromParsed(parsed, fileName) {
  const cert = emptyCertificate();
  cert.bankName = parsed.bankName || fileName.replace(/\.[^.]+$/, '');
  if (parsed.branchCode) cert.branchCode = String(parsed.branchCode);
  if (parsed.accountNumber) cert.accountNumber = String(parsed.accountNumber);
  cert.sourceFileName = fileName;
  Object.assign(cert.capGains, rateMapToStrings(parsed.capGains));
  Object.assign(cert.dividends, rateMapToStrings(parsed.dividends));
  Object.assign(cert.interest, rateMapToStrings(parsed.interest));
  if (parsed.offsetLosses != null) cert.offsetLosses = String(parsed.offsetLosses);
  if (parsed.capGainsWithheld != null) cert.capGainsWithheld = String(parsed.capGainsWithheld);
  if (parsed.turnover != null) cert.turnover = String(parsed.turnover);
  if (parsed.dividendForeignCredit != null) cert.dividendForeignCredit = String(parsed.dividendForeignCredit);
  if (parsed.dividendWithheld != null) cert.dividendWithheld = String(parsed.dividendWithheld);
  if (parsed.interestForeignCredit != null) cert.interestForeignCredit = String(parsed.interestForeignCredit);
  if (parsed.interestWithheld != null) cert.interestWithheld = String(parsed.interestWithheld);
  cert.parseStatus = parsed.found ? 'auto' : 'unrecognized';
  cert.parseNote = parsed.found
    ? 'הנתונים חולצו אוטומטית מהקובץ — נא לוודא מול המסמך המקורי לפני ההגשה.'
    : 'לא זוהה מבנה אישור 867 מוכר בקובץ זה — נא להזין את הנתונים ידנית.';
  return cert;
}

// מייצר אישור "ידני" (למשל עבור קובץ תמונה שלא ניתן לפענח אוטומטית, או שגיאת קריאה)
function certificateManual(fileName, note) {
  const cert = emptyCertificate();
  cert.bankName = fileName.replace(/\.[^.]+$/, '');
  cert.sourceFileName = fileName;
  cert.parseStatus = 'manual';
  cert.parseNote = note;
  return cert;
}

async function parsePdfFileToCertificate(file) {
  try {
    const buf = await file.arrayBuffer();
    const rows = await extractDocRows(buf);
    const parsed = parse867Rows(rows);
    return certificateFromParsed(parsed, file.name);
  } catch (e) {
    return certificateManual(file.name, 'שגיאה בקריאת הקובץ (' + (e && e.message ? e.message : e) + ') — נא להזין את הנתונים ידנית.');
  }
}

async function parseUploadedFilesToCertificates(files) {
  const results = [];
  for (const file of files) {
    const isPdf = /\.pdf$/i.test(file.name) || file.type === 'application/pdf';
    if (isPdf && window.pdfjsLib) {
      results.push(await parsePdfFileToCertificate(file));
    } else {
      results.push(certificateManual(file.name, 'קובץ תמונה — לא ניתן לחלץ נתונים אוטומטית; נא להזין ידנית (או להעלות את האישור כקובץ PDF אם קיים).'));
    }
  }
  return results;
}
window.parseUploadedFilesToCertificates = parseUploadedFilesToCertificates;

// ============================================================================
// חילוץ אוטומטי מקבצי טופס 106 (או מסמך ריכוז טפסי 106 למספר מעסיקים)
// ============================================================================
// בטופס 106 הרשמי, שורה 1 ("משכורת ותשלומים אחרים החייבים בשיעורי מס רגילים")
// מתויגת בשדה 172 (רשום/ה) או 158 (בן/בת זוג), שורה מקבילה לקצבה חייבת ("סכום
// הקצבה החייב", כגון בטופס 106 שמפיקות חברות ביטוח/פנסיה) מתויגת בשדה 258/272,
// ושורה 12 ("בהתאם לחוק ניכיתי ושילמתי מס הכנסה בסך") מתויגת בשדה 042 — אותם
// שדות המוזכרים בטופס 1301 עצמו. הקוד שנמצא בפועל בשורה קובע גם את סוג ההכנסה
// (משכורת/קצבה) — ר' incomeType — כדי שהמילוי האוטומטי של הטפסים הרשמיים ישבץ
// את הסכום בשדה הנכון (172/158 לעומת 258/272), גם אם התצוגה לכתחילה מכנה זאת
// "משכורת" (שני סוגי ההכנסה ממוסים זהה לצורך אומדן ההחזר).
let __form106IdSeq = 0;
function emptyForm106() {
  __form106IdSeq += 1;
  return {
    id: 'f106_' + Date.now() + '_' + __form106IdSeq,
    sourceFileName: '',
    employerName: '',
    incomeType: 'salary', // 'salary' (172/158) | 'pension' (258/272)
    salary: '',
    withheld: '',
    parseStatus: 'manual',
    parseNote: '',
  };
}

function pick106Number(row, excludeCodes) {
  const candidates = row.items
    .map((it) => cellText(it))
    .filter((t) => t !== '' && NUM_RE.test(t) && excludeCodes.indexOf(t) === -1)
    .map((t) => pnum(t))
    .filter((n) => n != null);
  if (!candidates.length) return null;
  // מעדיפים את הערך הגדול ביותר בשורה — סכומי שכר/ניכוי הם בד"כ המספר הדומיננטי,
  // בעוד שדות/קודים סמוכים (כגון קוד סעיף) הם קטנים ומוחרגים כבר לפי excludeCodes.
  return Math.max(...candidates);
}

// קודי שדה שמזהים שורת "הכנסה חייבת" — משכורת (172/158) או קצבה חייבת (258/272).
// בודקים כל קוד בנפרד (לא דורשים ששני הקודים המקבילים יופיעו יחד באותה שורה) כי
// בשורת הנתון בפועל מופיע בד"כ רק הקוד הרלוונטי לבעל הטופס (172 *או* 158), ולא
// שניהם יחד — הם מופיעים זה לצד זה רק בכותרת העמודה, לא בשורת הערך עצמה.
const INCOME_FIELD_CODES = [['172', 'salary'], ['158', 'salary'], ['258', 'pension'], ['272', 'pension']];

// בודק שהקוד מופיע כטוקן/פריט שלם בשורה (או כחלק מקוד משולב "272/258", נפוץ
// בתעודות קרן פנסיה שבהן שדה משכורת/קצבה משותף) — לא כתת-מחרוזת בתוך מספר גדול
// יותר (למשל "158" בתוך "6158102" — קוד פוליסה/מספר טלפון, לא שדה 158 האמיתי).
// זה היה באג אמיתי (כלל-2 106.pdf): משכורת יצאה 6,158,102 ₪ במקום 12,778 ₪, כי
// הבדיקה הקודמת חיפשה "158" כתת-מחרוזת בטקסט השורה כולו.
function rowHasExactToken(row, token) {
  return row.items.some((it) => {
    const t = cellText(it).trim();
    return t === token || t.split('/').indexOf(token) !== -1;
  });
}

// בחלק מקבצי 106 (פורמט PDF ישן/מסוים) כל אות עברית בשורה היא פריט טקסט נפרד
// לגמרי, ומופיעה ב-pdf.js ב*סדר הפוך* (הפריט הראשון הוא האות האחרונה שנקראת).
// אם מרבית הפריטים בשורה הם תו בודד, מרכיבים "טקסט משוחזר" ע"י היפוך סדר
// הפריטים והדבקתם ללא רווחים (רווחים אמיתיים כבר מיוצגים כפריטי-רווח/פריטים
// רב-תוויים שנשארים כמות שהם) — כדי שביטויים כמו שם המשלם (המסתיים ב"בע"מ" וכו')
// יהיו ניתנים לזיהוי בכלל.
function reconstructReversedRow(row) {
  const items = row.items.map((it) => cellText(it));
  const singleCharCount = items.filter((t) => t.length === 1).length;
  if (items.length < 4 || singleCharCount < items.length * 0.6) return null;
  // מוסיפים רווח בין תווים סמוכים כאשר הפער ב-x גדול משמעותית מהמרווח הרגיל בין
  // אותיות (מעיד על רווח אמיתי בין מילים שלא יוצג כפריט טקסט נפרד במקור).
  const rev = row.items.slice().reverse();
  let out = '';
  for (let k = 0; k < rev.length; k++) {
    const cur = cellText(rev[k]);
    out += cur;
    if (k < rev.length - 1) {
      const curW = (rev[k].width != null ? rev[k].width : 6);
      const gap = rev[k].x - (rev[k + 1].x + (rev[k + 1].width || 0));
      if (gap > curW * 0.6) out += ' ';
    }
  }
  return out;
}

function parse106Rows(rows) {
  const result = { employerName: '', salary: null, withheld: null, incomeType: 'salary', found: false, creditPoints: null };
  for (let i = 0; i < rows.length; i++) {
    const text = lineText(rows[i]);
    const reconstructed = reconstructReversedRow(rows[i]);
    if (!result.employerName && text.indexOf('שם מלא של המעביד') !== -1) {
      // שם המעביד עשוי להופיע באותה שורה או בשורה הבאה (מתחת לכותרת העמודה)
      const m = text.match(new RegExp('([\\u0590-\\u05FF"\'׳״ ]{2,})\\s*שם מלא של המעביד'));
      if (m && m[1].trim()) result.employerName = m[1].trim();
    }
    // תעודות קרן פנסיה/ביטוח מנהלים (חלופה ל"טופס 106" קלאסי) אינן משתמשות
    // בביטוי "שם מלא של המעביד" כלל — שם המשלם (הקופה) מופיע רק בכותרת הדף, בד"כ
    // כפריט עצמאי שמסתיים ב"קרן פנסיה"/"חברה לביטוח"/"קופת גמל"/"בע"מ". בודקים
    // כל פריט בשורה בנפרד (לא את השורה המחוברת כולה) — בטופס 106 "אמיתי" השם
    // מופיע כפריט אחרון בשורת "פרטי המעסיק" יחד עם סימוני חודשים (1-12), ולכן
    // התאמה על השורה השלמה (למשל "1 2 3...12 מגדל...") לא הייתה מוצאת אותו.
    if (!result.employerName && i < 15) {
      const payerRe = new RegExp('^([\\u0590-\\u05FF\'׳״ ]{2,40}(?:קרן פנסיה|קופת גמל|חברה לביטוח|בע"מ))$');
      for (const it of rows[i].items) {
        const mPayer = cellText(it).trim().match(payerRe);
        if (mPayer && mPayer[1].trim()) { result.employerName = mPayer[1].trim(); break; }
      }
      // אם השורה מפוצלת לתו-בודד לכל פריט (ר' reconstructReversedRow) — מחפשים
      // גם בטקסט המשוחזר (לא מעוגן לתחילת/סוף השורה, כי ייתכן טקסט נוסף בשורה).
      if (!result.employerName && reconstructed) {
        const payerReLoose = new RegExp('([\\u0590-\\u05FF\'׳״]{2,40}(?:קרן פנסיה|קופת גמל|חברה לביטוח|בע"מ))');
        const mPayer2 = reconstructed.match(payerReLoose);
        if (mPayer2 && mPayer2[1].trim()) result.employerName = mPayer2[1].trim();
        // תבנית נוספת: "<שם חברה> - קצבה/משכורת" (למשל "כלל ביטוח ופיננסים -
        // קצבה") — נפוץ בכותרות תעודות קרן פנסיה שאינן מסתיימות ב"בע"מ" וכדומה.
        if (!result.employerName) {
          const mPayer3 = reconstructed.match(new RegExp('([\\u0590-\\u05FF\'׳״ ]{2,40})\\s*-\\s*(?:קצבה|משכורת)\\s*$'));
          if (mPayer3 && mPayer3[1].trim()) result.employerName = mPayer3[1].trim();
        }
      }
    }
    // ערך נקודות זיכוי — מספר נקודות הזיכוי (למשל "2.75") מופיע בתוך תיאור השורה
    // עצמה ("ערך נקודות זיכוי 2.75"), לא כערך מספרי נפרד בעמודת סכום.
    if (result.creditPoints == null) {
      const mCredit = text.match(/נקודות זיכוי\s+(\d+(?:\.\d+)?)/);
      if (mCredit) result.creditPoints = mCredit[1];
    }
    if (result.salary == null) {
      const match = INCOME_FIELD_CODES.find(([code]) => rowHasExactToken(rows[i], code));
      if (match) {
        const n = pick106Number(rows[i], match.map(([code]) => code).concat(['172', '158', '258', '272']));
        if (n != null) { result.salary = n; result.incomeType = match[1]; result.found = true; }
      }
    }
    // בדרך כלל דורשים גם את הביטוי "ניכיתי"/"מס הכנסה" לצד הקוד 042, כדי לא לבלבל
    // עם 042 שמופיע כחלק ממספר אחר בטופס. בקבצים שבהם כל אות עברית מפוצלת לפריט
    // נפרד (תופעה נדירה בפורמט PDF ישן), סדר המילים בשורה עלול להתהפך ואז הביטוי
    // המדויק לא יימצא כתת-מחרוזת — לכן די בנוכחות אותיות עבריות כלשהן בשורה יחד
    // עם הקוד, כדי לא לפספס נתון אמיתי.
    if (result.withheld == null && rowHasExactToken(rows[i], '042') &&
        (text.indexOf('ניכיתי') !== -1 || text.indexOf('מס הכנסה') !== -1 || HEBREW_LETTER_RE.test(text))) {
      const n = pick106Number(rows[i], ['042']);
      if (n != null) { result.withheld = n; result.found = true; }
    }
  }
  return result;
}

function form106FromParsed(parsed, fileName) {
  const f = emptyForm106();
  f.sourceFileName = fileName;
  f.employerName = parsed.employerName || '';
  f.incomeType = parsed.incomeType || 'salary';
  f.salary = parsed.salary != null ? String(parsed.salary) : '';
  f.withheld = parsed.withheld != null ? String(parsed.withheld) : '';
  f.parseStatus = parsed.found ? 'auto' : 'unrecognized';
  // ערך נקודות זיכוי מהטופס (אם נמצא) — לא מוחל אוטומטית על שדה נקודות הזיכוי
  // האישי (שיש לו כבר ברירת מחדל/עריכה ידנית), אלא רק מוצג להשוואה/עדכון ידני.
  if (parsed.creditPoints) f.parseNote2CreditPoints = parsed.creditPoints;
  f.parseNote = parsed.found
    ? 'הנתונים חולצו אוטומטית מהקובץ (שדות 172/158/258/272 ו-042) — מנוע זה לא נבדק מול כל סוגי טופס 106 האפשריים, נא לוודא בקפידה מול המסמך המקורי (כולל סוג ההכנסה: משכורת/קצבה).'
      + (parsed.creditPoints ? (' נמצא בטופס ערך נקודות זיכוי: ' + parsed.creditPoints + ' — יש לעדכן ידנית בשדה "נקודות זיכוי" אם שונה מהמוגדר.') : '')
    : 'לא זוהה מבנה טופס 106 מוכר בקובץ זה — נא להזין את הנתונים ידנית.';
  return f;
}

function form106Manual(fileName, note) {
  const f = emptyForm106();
  f.sourceFileName = fileName;
  f.parseStatus = 'manual';
  f.parseNote = note;
  return f;
}

async function parse106PdfFile(file) {
  try {
    const buf = await file.arrayBuffer();
    const rows = await extractDocRows(buf);
    // אם לא נמצא בקובץ אף פריט טקסט — כנראה שמדובר בסריקה/תמונה בלי שכבת טקסט
    // (למשל PDF שנוצר מסריקה של הטופס), ואין דרך לחלץ ממנה נתונים אוטומטית בכלל.
    // הודעה זו שונה במכוון מ"לא זוהה מבנה מוכר" כדי שהמשתמש יבין שהבעיה היא
    // בקובץ עצמו (סרוק) ולא בליקוי בזיהוי — ושנדרשת הזנה ידנית, לא ניסיון חוזר.
    if (!rows.length) {
      return form106Manual(file.name, 'הקובץ נראה כסריקה/תמונה ללא שכבת טקסט (אין טקסט לחילוץ) — לא ניתן לקרוא ממנו נתונים אוטומטית. נא להזין את הנתונים ידנית לפי הטופס.');
    }
    const parsed = parse106Rows(rows);
    return form106FromParsed(parsed, file.name);
  } catch (e) {
    return form106Manual(file.name, 'שגיאה בקריאת הקובץ (' + (e && e.message ? e.message : e) + ') — נא להזין את הנתונים ידנית.');
  }
}

async function parseUploadedFilesToForm106s(files) {
  const results = [];
  for (const file of files) {
    const isPdf = /\.pdf$/i.test(file.name) || file.type === 'application/pdf';
    if (isPdf && window.pdfjsLib) {
      results.push(await parse106PdfFile(file));
    } else {
      results.push(form106Manual(file.name, 'קובץ תמונה — לא ניתן לחלץ נתונים אוטומטית; נא להזין ידנית (או להעלות כקובץ PDF אם קיים).'));
    }
  }
  return results;
}
// מחזיר גם פילוח לפי סוג הכנסה (salary/pension) — כדי שהמילוי האוטומטי של טופס
// 1301 ישבץ קצבה בשדה 258/272 ולא בטעות בשדה המשכורת 172/158.
function sumForm106(list) {
  return (list || []).reduce((s, f) => {
    const amount = num(f.salary);
    const isPension = f.incomeType === 'pension';
    return {
      salary: s.salary + (isPension ? 0 : amount),
      pension: s.pension + (isPension ? amount : 0),
      withheld: s.withheld + num(f.withheld),
    };
  }, { salary: 0, pension: 0, withheld: 0 });
}
window.emptyForm106 = emptyForm106;
window.parseUploadedFilesToForm106s = parseUploadedFilesToForm106s;
window.sumForm106 = sumForm106;



// כתובת שירות האימות - בודק בזמן אמת מול גיליון הלקוחות ב-Google Sheets
// (שם מלא + שנת מס + ת.ז. בן/בת הזוג הרשום/ה) לפני שממשיכים לאשף.
// לעולם לא נשלח לדפדפן שום תוכן מהגיליון - רק תוצאת אישור/דחייה.
// זו גרסת ה-GitHub Pages של האשף (מתארחת חיצונית, לא על השרת המקומי) - ולכן
// בניגוד לגרסה המקומית (_V1.html, שמשתמשת בנתיב יחסי '/verify' כי היא
// מוגשת מאותו שרת), כאן חייבים כתובת מלאה ל-Web App של Google Apps Script,
// כי אין שרת מקומי מתווך כשמשתמש חיצוני פותח את הדף.
const IDENTITY_SERVER_URL = 'https://script.google.com/macros/s/AKfycbyUrYyz6ojEH4afOghGKpfCd33i8Zum4HGCqxh_o3yxYyKi8nzBsxcoMDmWD7P9letGMQ/exec';

function Step0Identity({ data, setData, onNext }) {
  const { Button, Alert } = window.YairDesignSystem_29a38a;
  const years = ['2025', '2024', '2023', '2022', '2021'];
  const [fullName, setFullName] = React.useState(data.identityFullName || '');
  const [idNumber, setIdNumber] = React.useState(data.identityId || '');
  const [status, setStatus] = React.useState('idle'); // idle | checking | invalid | offline | missing
  const [missingFields, setMissingFields] = React.useState([]);
  const canSubmit = status !== 'checking';

  const verify = async () => {
    const missing = [];
    if (!data.taxYear) missing.push('שנת מס');
    if (!fullName.trim()) missing.push('שם מלא');
    if (!idNumber.trim()) missing.push('ת.ז. הנישום (בן/בת הזוג הרשום/ה)');
    if (missing.length) {
      setMissingFields(missing);
      setStatus('missing');
      return;
    }
    setStatus('checking');
    let res;
    try {
      res = await fetch(IDENTITY_SERVER_URL, {
        method: 'POST',
        // text/plain (לא application/json) בכוונה - כדי שהדפדפן יתייחס לזה
        // כ"בקשה פשוטה" ולא ישלח preflight (OPTIONS) לפני כן. Google Apps
        // Script Web Apps לא מטפלים טוב ב-preflight חוצה-מקור, וזה גורם
        // ל-fetch להיכשל ברמת הרשת. Apps Script קורא את הגוף כטקסט/JSON
        // ללא תלות בכותרת Content-Type, אז זה לא משנה שם דבר.
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ fullName: fullName.trim(), idNumber: idNumber.trim(), taxYear: data.taxYear }),
      });
    } catch (e) {
      setStatus('offline');
      return;
    }
    let json;
    try { json = await res.json(); } catch (e) { json = null; }
    if (res.ok && json && json.ok) {
      setData({
        ...data,
        identityFullName: fullName.trim(),
        identityId: idNumber.trim(),
        registered: { ...data.registered, id: idNumber.trim() },
      });
      setStatus('idle');
      onNext();
    } else if (res.status === 503 || (json && json.reason === 'customers_file_locked')) {
      setStatus('offline');
    } else {
      setStatus('invalid');
    }
  };

  return (
    <StepShell title="הזדהות" subtitle="לצורך אימות תוקף הרישיון, יש למלא שנת מס, שם מלא ות.ז. הנישום (בן/בת הזוג הרשום/ה)"
      footer={<React.Fragment><span/><Button variant="primary" onClick={verify} disabled={!canSubmit}>{status === 'checking' ? 'בודק…' : 'המשך'}</Button></React.Fragment>}>
      <Field label="שנת מס">
        <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap' }}>
          {years.map((y) => (
            <button key={y} onClick={() => setData({ ...data, taxYear: y })}
              style={{ height: 56, minWidth: 96, borderRadius: 'var(--radius-md)', border: data.taxYear === y ? '2px solid var(--brand-primary)' : '1px solid var(--border-default)', background: data.taxYear === y ? 'var(--color-info-bg)' : '#fff', color: data.taxYear === y ? 'var(--brand-primary)' : 'var(--text-primary)', fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: 18, cursor: 'pointer' }}>
              {y}
            </button>
          ))}
        </div>
      </Field>
      <div style={{ height: 24 }} />
      <Grid cols={2}>
        <Field label="שם מלא">{plainInput(fullName, setFullName)}</Field>
        <Field label="ת.ז. הנישום (בן/בת הזוג הרשום/ה)">{plainInput(idNumber, setIdNumber, { direction: 'ltr' })}</Field>
      </Grid>
      <div style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 8 }}>
        לקוח פרטי: שם פרטי ושם משפחה של בן/בת הזוג הרשום/ה (הנישום). לקוח עסקי: השם המלא של הלקוח — לא של הנישום.
      </div>
      {status === 'missing' && (
        <div style={{ marginTop: 20 }}>
          <Alert tone="error" title="יש להשלים פרטים"
            description={'לא ניתן להמשיך ללא: ' + missingFields.join(', ') + '.'} />
        </div>
      )}
      {status === 'invalid' && (
        <div style={{ marginTop: 20 }}>
          <Alert tone="error" title="הזדהות נכשלה"
            description="רישיון לשנת המס שהוקשה אינו בתוקף, או ת.ז. של הנישום שגויה." />
        </div>
      )}
      {status === 'offline' && (
        <div style={{ marginTop: 20 }}>
          <Alert tone="error" title="המערכת לא זמינה"
            description="לא ניתן היה להתחבר לשירות האימות כרגע. נסה שוב מאוחר יותר." />
        </div>
      )}
    </StepShell>
  );
}

const SignaturePad = React.forwardRef(function SignaturePad(props, ref) {
  const canvasRef = React.useRef(null);
  const drawingRef = React.useRef(false);
  const [empty, setEmpty] = React.useState(true);

  const sizeCanvas = React.useCallback(() => {
    const c = canvasRef.current;
    if (!c) return;
    const rect = c.getBoundingClientRect();
    if (rect.width && rect.height) {
      const ratio = window.devicePixelRatio || 1;
      c.width = rect.width * ratio;
      c.height = rect.height * ratio;
      const ctx = c.getContext('2d');
      ctx.scale(ratio, ratio);
    }
  }, []);

  React.useEffect(() => {
    sizeCanvas();
    window.addEventListener('resize', sizeCanvas);
    return () => window.removeEventListener('resize', sizeCanvas);
  }, [sizeCanvas]);

  const getPoint = (e) => {
    const c = canvasRef.current;
    const rect = c.getBoundingClientRect();
    const t = e.touches && e.touches[0];
    const x = (t ? t.clientX : e.clientX) - rect.left;
    const y = (t ? t.clientY : e.clientY) - rect.top;
    return { x, y };
  };

  const setNotEmpty = () => {
    if (empty) {
      setEmpty(false);
      if (props.onChangeEmpty) props.onChangeEmpty(false);
    }
  };

  const startDraw = (e) => {
    e.preventDefault();
    drawingRef.current = true;
    const p = getPoint(e);
    const ctx = canvasRef.current.getContext('2d');
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.strokeStyle = '#111827';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    setNotEmpty();
  };
  const moveDraw = (e) => {
    if (!drawingRef.current) return;
    e.preventDefault();
    const p = getPoint(e);
    const ctx = canvasRef.current.getContext('2d');
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  };
  const endDraw = () => { drawingRef.current = false; };
  const clear = () => {
    const c = canvasRef.current;
    if (!c) return;
    const ctx = c.getContext('2d');
    ctx.clearRect(0, 0, c.width, c.height);
    setEmpty(true);
    if (props.onChangeEmpty) props.onChangeEmpty(true);
  };

  React.useImperativeHandle(ref, () => ({
    capture: () => (empty ? null : canvasRef.current.toDataURL('image/png')),
    isEmpty: () => empty,
    clear,
  }));

  return (
    <div>
      <div style={{ border: '1px solid var(--border-default)', borderRadius: 'var(--radius-md)', background: 'var(--surface-page)', height: 110, position: 'relative', overflow: 'hidden' }}>
        <canvas ref={canvasRef} style={{ touchAction: 'none', cursor: 'crosshair', display: 'block', width: '100%', height: '100%' }}
          onMouseDown={startDraw} onMouseMove={moveDraw} onMouseUp={endDraw} onMouseLeave={endDraw}
          onTouchStart={startDraw} onTouchMove={moveDraw} onTouchEnd={endDraw} />
        {empty && <span style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 12, color: 'var(--text-muted)', pointerEvents: 'none' }}>חתמו כאן באמצעות העכבר / מגע</span>}
      </div>
      <div style={{ display: 'flex', justifyContent: 'flex-end', marginTop: 6 }}>
        <span onClick={clear} style={{ fontSize: 12, color: 'var(--text-muted)', cursor: 'pointer' }}>נקה</span>
      </div>
    </div>
  );
});

              <div style={boxStyle}>הכנסה מני"ע (ר"ה נספח ג)<br /><b>{fmtILS(sp.securities.totalIncome)}</b></div>
              <div style={boxStyle}>מחזור מכירות ני"ע (שדה 256)<br /><b>{fmtILS(sp.securities.turnover)}</b></div>
              <div style={boxStyle}>ניכוי במקור ממשכורת (שדה 042)<br /><b>{fmtILS(sp.salary.withheld)}</b></div>
              <div style={boxStyle}>ניכוי במקור מני"ע (שדה 040)<br /><b>{fmtILS(sp.securities.totalWithheld)}</b></div>
              <div style={boxStyle}>מס לתשלום (מחושב)<br /><b>{fmtILS(sp.owed)}</b></div>
              <div style={hiBox}>החזר מס<br /><b>{fmtILS(sp.refund)}</b></div>
            </div>
          </React.Fragment>
        )}
      </div>
    );
  }
  if (docKey === 'kibbutz') {
    return (
      <div style={wrap}>
        <Header title="נספח 1443 — דיווח חבר/תושב קיבוץ" formNo="1443" />
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8, fontSize: 13, color: '#3a3626' }}>
          <div>שם קיבוץ: {data.kibbutz.name || '—'}</div>
          <div>מספר תיק: {data.kibbutz.fileNumber || '—'}</div>
          <div>מתייחס ל: {data.kibbutz.memberSpouse === 'registered' ? 'בן/בת הזוג הרשום/ה' : 'בן/בת הזוג'}</div>
        </div>
      </div>
    );
  }
  const totalIncome = reg.securities.totalIncome + (needsSpouse ? sp.securities.totalIncome : 0);
  const totalTax = reg.securities.totalTax + (needsSpouse ? sp.securities.totalTax : 0);
  const totalWithheld = reg.securities.totalWithheld + (needsSpouse ? sp.securities.totalWithheld : 0);
  const totalRefund = reg.securities.refund + (needsSpouse ? sp.securities.refund : 0);
  return (
    <div style={wrap}>
      <Header title='דו"ח 867 — ריכוז ניכויי מס במקור' formNo="867" />
      <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
        <div style={boxStyle}>אישורי בנק<br /><b>{data.securities.length}</b></div>

        <div style={hiBox}>הפרש לזיכוי<br /><b>{fmtILS(totalRefund)}</b></div>
      </div>
    </div>
  );
}

// קובץ נתונים בפורמט הנקרא ישירות ע"י הסקריפט fill_1301.py (תיקיית "מילוי טפסים
// (Python)"), כדי שהמעבר מהאשף למילוי בפועל של הטפסים הרשמיים יהיה בלחיצה אחת —
// הרצת הסקריפט על קובץ זה — ולא הקלדה חוזרת של הסכומים. שדות שהאשף אינו מחשב
// בנפרד (כגון קצבה, "רווחים פטורים") נשלחים כ-0 וידלגו במילוי.
// מחשב את אותם ערכי שדות ("values") המשמשים גם את קובץ הנתונים ל-Python וגם את
// מנוע המילוי הישיר בדפדפן (fillOfficialFormPdfs) — כדי ששני המסלולים תמיד יציגו
// בדיוק אותם מספרים ולא יסטו זה מזה.
function computeFormValues(data) {
  const { reg, sp, needsSpouse } = getRefundBreakdown(data);
  const rate = (person, rate) => Math.round((person.securities.dividendsByRate && person.securities.dividendsByRate[rate]) || 0);
  const irate = (person, rate) => Math.round((person.securities.interestByRate && person.securities.interestByRate[rate]) || 0);
  const capgainRate = (regP, spP, hasSpouse, r, key) => Math.round(
    ((regP.securities[key] && regP.securities[key][r]) || 0) + (hasSpouse ? ((spP.securities[key] && spP.securities[key][r]) || 0) : 0)
  );
  // reg.salary.income/sp.salary.income הם הסכום הכולל (משכורת + קצבה + הכנסה נוספת
  // ידנית) המשמש לחישוב המס עצמו; לצורך מילוי הטופס הרשמי יש לפצל בחזרה בין שדה
  // המשכורת (172/158) לשדה הקצבה החייבת (258/272), לפי הפילוח שכבר חושב ב-from106.
  const salaryPart = (person, p) => Math.round(num(p.annualIncome) + person.salary.from106.salary);
  const pensionPart = (person) => Math.round(person.salary.from106.pension);
  return {
    salary_registered: salaryPart(reg, data.registered),
    salary_spouse: needsSpouse ? salaryPart(sp, data.spouse) : 0,
    pension_registered: pensionPart(reg),
    pension_spouse: needsSpouse ? pensionPart(sp) : 0,
    dividend25_registered: rate(reg, 25),
    dividend25_spouse: needsSpouse ? rate(sp, 25) : 0,
    interest25_registered: irate(reg, 25),
    interest25_spouse: needsSpouse ? irate(sp, 25) : 0,
    interest15_registered: irate(reg, 15),
    interest15_spouse: needsSpouse ? irate(sp, 15) : 0,
    turnover_total: Math.round(reg.securities.turnover + (needsSpouse ? sp.securities.turnover : 0)),
    exempt_total: 0,
    withheld_salary_total: Math.round(reg.salary.withheld + (needsSpouse ? sp.salary.withheld : 0)),
    withheld_securities_total: Math.round(reg.securities.totalWithheld + (needsSpouse ? sp.securities.totalWithheld : 0)),
    // מספר אישורי 867 (בנק) שצורפו — שדה 54/037 בטופס 1301.
    securities_certificates_count: (data.securities || []).length,
    // רווח הון גולמי (לפני קיזוז הפסד) לפי שיעור, משני בני הזוג יחד — שורה 1
    // בסעיף ג' בנספח ג (טופס 1322). המקור: capGainsGrossByRate שנחשב פעם אחת
    // ב-calcSecuritiesForOwner ומוזן גם לכאן וגם לחישוב הרווח נטו/המס.
    capgain_gross_15: capgainRate(reg, sp, needsSpouse, 15, 'capGainsGrossByRate'),
    capgain_gross_20: capgainRate(reg, sp, needsSpouse, 20, 'capGainsGrossByRate'),
    capgain_gross_25: capgainRate(reg, sp, needsSpouse, 25, 'capGainsGrossByRate'),
    capgain_gross_30: capgainRate(reg, sp, needsSpouse, 30, 'capGainsGrossByRate'),
    capgain_gross_35: capgainRate(reg, sp, needsSpouse, 35, 'capGainsGrossByRate'),
    // הפסד הון ששימש לקיזוז רווח הון (שורה 2 בסעיף ג', "קיזוז הפסדי הון שוטפים
    // מניירות ערך") = ברוטו פחות נטו, לפי שיעור — כמה מהרווח הגולמי בכל שיעור
    // "נאכל" ע"י ההפסד שקוזז (השיעורים הגבוהים נכנסים ראשונים, ר' calcSecuritiesForOwner).
    capgain_loss_offset_15: capgainRate(reg, sp, needsSpouse, 15, 'capGainsGrossByRate') - capgainRate(reg, sp, needsSpouse, 15, 'capGainsNetByRate'),
    capgain_loss_offset_20: capgainRate(reg, sp, needsSpouse, 20, 'capGainsGrossByRate') - capgainRate(reg, sp, needsSpouse, 20, 'capGainsNetByRate'),
    capgain_loss_offset_25: capgainRate(reg, sp, needsSpouse, 25, 'capGainsGrossByRate') - capgainRate(reg, sp, needsSpouse, 25, 'capGainsNetByRate'),
    capgain_loss_offset_30: capgainRate(reg, sp, needsSpouse, 30, 'capGainsGrossByRate') - capgainRate(reg, sp, needsSpouse, 30, 'capGainsNetByRate'),
    capgain_loss_offset_35: capgainRate(reg, sp, needsSpouse, 35, 'capGainsGrossByRate') - capgainRate(reg, sp, needsSpouse, 35, 'capGainsNetByRate'),
    // הפסד הון להעברה לשנת המס הבאה (יתרת הפסד שלא נוצלה כלל, אחרי קיזוז מול
    // רווח הון, דיבידנד וריבית) — נספח ג, "הפסדים להעברה מניירות ערך".
    securities_loss_carryforward: Math.round(reg.securities.unusedLoss + (needsSpouse ? sp.securities.unusedLoss : 0)),
  };
}

function buildPythonDataJson(data) {
  const values = computeFormValues(data);
  const label = (data.registered.firstName + ' ' + data.registered.lastName + ' ' + data.taxYear).trim() || ('דוח ' + data.taxYear);
  return JSON.stringify({
    label,
    _note: 'הופק אוטומטית ע"י אשף החזרי מס. הרצה: python fill_1301.py --data "' + label + '.json"',
    _generatedAt: new Date().toISOString(),
    values,
  }, null, 2);
}

// ============================================================================
// מילוי אוטומטי של טופס 1301 ונספח ג (1322) ישירות בדפדפן — הפעלת הכפתור "מילוי
// טפסי PDF" קוראת את הטפסים הריקים הרשמיים המוטמעים (form_templates_data.js),
// מאתרת בכל אחד מהם את מיקום קוד השדה (למשל "172", "042") באמצעות pdf.js (בדיוק

function b64ToBytes(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

// מאתר, עבור עמוד נתון, את המיקום (x,y בקואורדינטות PDF מקוריות — אותה מערכת
// שבה pdf-lib מצייר טקסט) של פריט טקסט שתוכנו שווה בדיוק לקוד השדה המבוקש.
// כאשר קוד שדה (כגון "040") מופיע יותר מפעם אחת בעמוד — פעם כקוד השדה האמיתי
// ליד תיבת הערך, ופעם כאזכור טקסטואלי בתוך פסקת הסבר במקום אחר — התוצאות
// ממוינות לפי y יורד (pdf-lib, כלומר מהגבוה בעמוד/הראשון בקריאה ולמטה), כדי
// שoccurrence 0 יהיה תמיד המופע העליון בעמוד באופן עקבי, ולא סדר מקרי לפי
// המערך הפנימי של pdf.js (מאומת מול פלט אמיתי: כך זוהה נכון שדה 87/040).
async function findFieldPositionsOnPage(pdfjsDoc, pageIndex0, code) {
  const page = await pdfjsDoc.getPage(pageIndex0 + 1);
  const content = await page.getTextContent();
  return content.items
    .filter((it) => it.str && it.str.trim() === code)
    .map((it) => ({ x: it.transform[4], y: it.transform[5] }))
    .sort((a, b) => b.y - a.y);
}

// כמו findFieldPositionsOnPage, אך לפי הכלה (substring) ולא התאמה מדויקת — נדרש
// כי pdf.js לעיתים מאחד כמה מילות תווית לפריט טקסט אחד ארוך (למשל "שם המנכה"
// כפריט יחיד, לא "שם"+"המנכה" בנפרד; או "העברה לשדות 055/141/157/067/060" כפריט
// אחד שלם) — חיפוש מדויק לפי המילה הבודדת "המנכה" לא מוצא כלום במקרה כזה. מסוכן
// להשתמש בזה לקודי שדה מספריים קצרים (סיכון התנגשות עם מספרים אחרים בעמוד) —
// מיועד רק לתוויות טקסטואליות ארוכות/ייחודיות למדי.
async function findLabelPositionsContaining(pdfjsDoc, pageIndex0, substr) {
  const page = await pdfjsDoc.getPage(pageIndex0 + 1);
  const content = await page.getTextContent();
  return content.items
    .filter((it) => it.str && it.str.indexOf(substr) !== -1)
    .map((it) => ({ x: it.transform[4], y: it.transform[5] }))
    .sort((a, b) => b.y - a.y);
}

// ממלא קובץ PDF ריק בודד לפי מפת שדות + ערכים, ומחזיר את הבייטים המוכנים לשמירה.
// extra: קולבק אופציונלי (pdfDoc, font) => Promise — להוספת תוכן שלא ניתן לאתר
// באמצעות חיפוש קוד שדה (למשל תיבות סימון וחתימות, ר' fillPage0PersonalDetails).
async function fillPdfTemplate(templateBytes, fieldMap, values, extra) {
  const pdfjsDoc = await window.pdfjsLib.getDocument({ data: templateBytes.slice() }).promise;
  const pdfDoc = await window.PDFLib.PDFDocument.load(templateBytes);
  const font = await pdfDoc.embedFont(window.PDFLib.StandardFonts.Helvetica);
  const fontSize = 9;
  const gap = 3;
  const filled = [], skipped = [];

  for (const [pageIdx, code, key] of fieldMap) {
    const val = values[key];
    if (!val) continue; // ערך ריק/אפס — מדלגים, בדיוק כמו fill_1301.py
    if (pageIdx >= pdfDoc.getPageCount()) { skipped.push(key); continue; }
    const positions = await findFieldPositionsOnPage(pdfjsDoc, pageIdx, code);
    if (!positions.length) { skipped.push(key); continue; }
    const pos = positions[0]; // מופע ראשון בעמוד — תואם לכל קודי המיפוי הנוכחיים
    const text = Math.round(val).toLocaleString('en-US');
    const textWidth = font.widthOfTextAtSize(text, fontSize);
    const page = pdfDoc.getPage(pageIdx);
    page.drawText(text, {
      x: pos.x - gap - textWidth,
      y: pos.y,
      size: fontSize,
      font,
      color: window.PDFLib.rgb(0, 0, 0.8),
    });
    filled.push(key);
  }
  const extraResult = extra ? await extra(pdfDoc, font, pdfjsDoc) : null;
  if (extraResult) { filled.push(...extraResult.filled); skipped.push(...extraResult.skipped); }
  return { bytes: await pdfDoc.save(), filled, skipped };
}

// pdf-lib מצייר מחרוזות תמיד משמאל-לימין לפי סדר התווים במחרוזת (אין לו תמיכת
// bidi מובנית) — כדי שטקסט עברי יוצג נכון מימין-לשמאל, הופכים את סדר ה"מקטעים"
// המופרדים ברווח, ומהפכים גם את סדר התווים בתוך מקטע עברי טהור (לא נוגעים
// במקטעים שהם מספרים, כדי שמספרי רחוב/בית לא יתהפכו בתוך הכתובת).
function layoutRtlText1301(text) {
  // עדכון: דיווח משתמש בפועל (Microsoft Edge PDF viewer) על טקסט שיצא "כתב ראי" —
  // כלומר ההיפוך הידני כאן כפול על היפוך שה-renderer עצמו מבצע לטקסט עברי בגופן
  // Type0 מוטבע. משאירים את המחרוזת בסדר הלוגי הרגיל (בלי היפוך) — זה מה שעבד.
  return text;
}

function drawRightAlignedText1301(page, text, pos, font, color) {
  if (!text) return false;
  const t = String(text).trim();
  if (!t) return false;
  const size = pos.size || 9;
  const displayText = layoutRtlText1301(t);
  const width = font.widthOfTextAtSize(displayText, size);
  page.drawText(displayText, { x: pos.x - width, y: pos.y, size, font, color: color || window.PDFLib.rgb(0, 0, 0.8) });
  return true;
}

// מסמנים תיבת סימון ע"י "X" ממורכז סביב הנקודה — התיבות בטופס הריק הן ריבועים
// קטנים (כ-6x6 נקודות); "X" באותו סדר גודל מתיישב היטב בתוכן.
function drawCheckMark1301(page, pos, font) {
  if (!pos) return false;
  const size = 8;
  const text = 'X';
  const width = font.widthOfTextAtSize(text, size);
  page.drawText(text, { x: pos.x - width / 2, y: pos.y - size * 0.35, size, font, color: window.PDFLib.rgb(0.8, 0, 0) });
  return true;
}

async function embedSignaturePng(pdfDoc, dataUrl) {
  if (!dataUrl || dataUrl.indexOf('data:image/png;base64,') !== 0) return null;
  try {
    return await pdfDoc.embedPng(b64ToBytes(dataUrl.slice('data:image/png;base64,'.length)));
  } catch (e) {
    return null;
  }
}

// ממלא בעמוד הראשון של טופס 1301 את מה שלא ניתן למפות לפי קוד שדה: תיבות הסימון
// (מצב משפחתי, בסיס הדוח, חברות בקיבוץ), שם/כתובת/ת.ז./תאריך לידה של בן/בת הזוג
// הרשום/ה ובן/בת הזוג, וחתימות שנאספו בשלב החתימה. ת.ז. ותאריך לידה מודפסים
// כמחרוזת רציפה אחת (לא מיושר לתיבת-ספרה-לכל-תא בטופס) — לפי בקשת המשתמש, זה
// "מספיק טוב" גם בלי יישור מדויק לכל תא בנפרד.
async function fillPage0PersonalDetails(pdfDoc, data) {
  const filled = [], skipped = [];
  if (pdfDoc.getPageCount() < 1) return { filled, skipped };
  const layout = PAGE0_LAYOUT_1301_BY_YEAR[data.taxYear];
  if (!layout) {
    // אין קואורדינטות מדודות לשנה הזו — לא מנחשים על טופס רשמי; שדות המספרים עדיין
    // ממולאים תקין ללא תלות בטבלה הזו (הם מאתרים את מיקומם בעצמם בכל שנה).
    skipped.push('personal_details_and_checkboxes (טרם נמדדו קואורדינטות עבור שנת מס ' + data.taxYear + ' — יש למלא ידנית את הפרטים האישיים, תיבות הסימון והחתימות בעמוד הראשון)');
    return { filled, skipped };
  }
  const CHECKBOX_POSITIONS_1301_PAGE0 = layout.checkboxes;
  const TEXT_POSITIONS_1301_PAGE0 = layout.text;
  const SIGNATURE_POSITIONS_1301_PAGE0 = layout.signatures;
  const page = pdfDoc.getPage(0);
  const checkFont = await pdfDoc.embedFont(window.PDFLib.StandardFonts.Helvetica);
  // הגופנים המובנים ב-pdf-lib (Helvetica וכו') תומכים רק בלטינית (WinAnsi) — שמות
  // וכתובות הם עברית, ולכן דורשים גופן מוטבע (Alef) עם fontkit רשום. תיבות הסימון
  // ("X") הן ASCII ולכן ממשיכות להשתמש ב-Helvetica הרגיל.
  let hebFont = checkFont;
  if (window.fontkit && window.HEBREW_FONT_TTF_B64) {
    try {
      pdfDoc.registerFontkit(window.fontkit);
      hebFont = await pdfDoc.embedFont(b64ToBytes(window.HEBREW_FONT_TTF_B64));
    } catch (e) { hebFont = null; }
  } else {
    hebFont = null;
  }
  const reg = data.registered || {};

  const cbMarital = CHECKBOX_POSITIONS_1301_PAGE0.maritalStatus[data.maritalStatus];
  if (drawCheckMark1301(page, cbMarital, checkFont)) filled.push('marital_status'); else skipped.push('marital_status');

  const needsSpouse = data.form1301 && data.form1301.reportBasis === 'both' && data.maritalStatus === 'married';
  const cbReport = CHECKBOX_POSITIONS_1301_PAGE0.reportBasis[needsSpouse ? 'both' : 'own'];
  if (drawCheckMark1301(page, cbReport, checkFont)) filled.push('report_basis'); else skipped.push('report_basis');

  if (!hebFont) {
    skipped.push('last_name (לא נטען גופן עברי)', 'first_name (לא נטען גופן עברי)', 'father_name (לא נטען גופן עברי)', 'residential_address (לא נטען גופן עברי)');
    return { filled, skipped };
  }

  if (data.kibbutz && data.kibbutz.isMember) {
    if (drawCheckMark1301(page, CHECKBOX_POSITIONS_1301_PAGE0.kibbutzMember, checkFont)) filled.push('kibbutz_member');
    if (drawRightAlignedText1301(page, data.kibbutz.fileNumber, TEXT_POSITIONS_1301_PAGE0.kibbutzFileNumber, checkFont)) filled.push('kibbutz_file_number');
    // שם הקיבוץ (למשל "עמיר") בשורה "הנני ו/או בן זוגי חבר קיבוץ ___" — היה חסר
    // לגמרי בעמ' 0 של 1301 (מולא רק בנספח 1443 הנפרד). דורש גופן עברי.
    if (drawRightAlignedText1301(page, data.kibbutz.name, TEXT_POSITIONS_1301_PAGE0.kibbutzName, hebFont)) filled.push('kibbutz_name'); else skipped.push('kibbutz_name');
  }

  // "אני מגיש דוח לשנת מס זו למרות שאיני חייב — בקשה להחזר מס": מסומן תמיד — זו
  // בדיוק הסיבה שהמשתמש/ת ממלא/ת את האשף הזה מלכתחילה.
  if (drawCheckMark1301(page, CHECKBOX_POSITIONS_1301_PAGE0.requestingRefund, checkFont)) filled.push('requesting_refund_checkbox');

  const spouse = data.spouse || {};
  const T = TEXT_POSITIONS_1301_PAGE0;
  const put = (value, pos, key, font) => {
    if (drawRightAlignedText1301(page, value, pos, font || hebFont)) filled.push(key); else skipped.push(key);
  };
  put(reg.lastName, T.lastName, 'last_name');
  put(reg.firstName, T.firstName, 'first_name');
  put(reg.fatherName, T.fatherName, 'father_name');
  put(data.taxOffice, T.taxOffice, 'tax_office');
  // ת.ז. ותאריך לידה — מודפסים כמחרוזת רציפה (לא מיושר לתיבות הספרות הבודדות
  // בטופס), לפי בקשת המשתמש: "מספיק טוב" גם בלי יישור מדויק לכל תא.
  put(reg.id, T.idNumber, 'id_number', checkFont);
  put(reg.dob, T.dob, 'date_of_birth', checkFont);
  if (data.maritalStatus === 'married') {
    put(spouse.lastName, T.spouseLastName, 'spouse_last_name');
    put(spouse.firstName, T.spouseFirstName, 'spouse_first_name');
    put(spouse.fatherName, T.spouseFatherName, 'spouse_father_name');
    put(spouse.id, T.spouseIdNumber, 'spouse_id_number', checkFont);
    put(spouse.dob, T.spouseDob, 'spouse_date_of_birth', checkFont);
    put(spouse.phone, T.workPhoneSpouse, 'spouse_phone', checkFont);
  }
  if (data.form1301) {
    put(data.form1301.residentialAddress, T.residentialAddress, 'residential_address');
    put(data.form1301.mailingAddress, T.mailingAddress, 'mailing_address');
  }
  put(reg.email, T.email, 'email');
  put(reg.phone, T.mobilePhone, 'mobile_phone', checkFont);
  put(reg.phone, T.workPhoneRegistered, 'work_phone', checkFont);
  put(reg.mainOccupation, T.occupation, 'occupation');
  put(reg.businessName, T.businessName, 'business_name');
  put(reg.businessAddress, T.businessAddress, 'business_address');
  put(reg.mainFileNumber, T.mainFileNumber, 'main_file_number', checkFont);
  put(reg.employerNames, T.employerNames, 'employer_names');
  put(reg.bankAccount, T.bankAccount, 'bank_account', checkFont);
  put(reg.branchCode, T.branchCode, 'branch_code', checkFont);
  put(reg.bankCode, T.bankCode, 'bank_code', checkFont);
  put(reg.accountHolderName, T.accountHolderName, 'account_holder_name');

  const f1301Doc = (data.signDocs || []).find((d) => d.key === 'f1301');
  if (f1301Doc) {
    let dateWritten = false;
    for (const signer of f1301Doc.signers) {
      const spotKey = signer.role === 'spouse' ? 'spouse' : 'registered';
      const spot = SIGNATURE_POSITIONS_1301_PAGE0[spotKey];
      const img = signer.signatureDataUrl ? await embedSignaturePng(pdfDoc, signer.signatureDataUrl) : null;
      if (img) {
        page.drawImage(img, { x: spot.x, y: spot.y, width: spot.width, height: spot.height });
        filled.push('signature_' + spotKey);
        // תאריך החתימה — שדה אחד משותף בטופס (לא לכל חותם בנפרד); כותבים לפי
        // התאריך של החתימה הראשונה שנמצאה.
        if (!dateWritten && signer.signedAt) {
          const dateOnly = String(signer.signedAt).split('·')[0].trim();
          if (drawRightAlignedText1301(page, dateOnly, T.signatureDate, checkFont)) { filled.push('signature_date'); dateWritten = true; }
        }
      } else {
        skipped.push('signature_' + spotKey);
      }
    }
    if (!dateWritten) skipped.push('signature_date');
  }

  return { filled, skipped };
}

// בוחר את בייטי הטופס הריק המתאימים לשנת המס המבוקשת (קריטי: טפסים רשמיים
// משתנים מדי שנה — קודי שדות, ולעיתים גם עמודים שלמים, אינם זהים בין שנים).
// אם השנה המדויקת חסרה מהאוסף המוטבע, נופלים לשנה הזמינה הקרובה ביותר ומדווחים
// על כך בבירור בדוח, במקום להשתמש בשקט בטופס של שנה אחרת.
function pickTemplateForYear(byYearMap, taxYear) {
  if (byYearMap[taxYear]) return { b64: byYearMap[taxYear], usedYear: taxYear, isFallback: false };
  const years = Object.keys(byYearMap).map(Number).sort((a, b) => a - b);
  if (!years.length) return null;
  const target = Number(taxYear);
  let closest = years[0];
  for (const y of years) { if (Math.abs(y - target) < Math.abs(closest - target)) closest = y; }
  return { b64: byYearMap[String(closest)], usedYear: String(closest), isFallback: true };
}

// נספח 1443 (דיווח חבר/תושב קיבוץ) — ממלא רק את מה שניתן לאתר בביטחון ע"י חיפוש
// טקסט חי (שם הקיבוץ, מספר התיק, שנת המס) — בלי קואורדינטות קבועות מראש, ולכן
// לא רגיש לשינויי פריסה בין שנים. פרטי החברות בקיבוץ (חבר/תושב/חבר בחופשה) ופרטי
// בני הזוג (ת.ז./שם) אינם נאספים כיום ע"י האשף בפירוט הדרוש לטופס זה — יש להשלים
// אותם ידנית מול הטופס.
async function fillForm1443(data) {
  const filled = [], skipped = [];
  const pdfjsDoc = await window.pdfjsLib.getDocument({ data: b64ToBytes(window.BLANK_FORM_1443_B64).slice() }).promise;
  const pdfDoc = await window.PDFLib.PDFDocument.load(b64ToBytes(window.BLANK_FORM_1443_B64));
  const checkFont = await pdfDoc.embedFont(window.PDFLib.StandardFonts.Helvetica);
  let hebFont = null;
  if (window.fontkit && window.HEBREW_FONT_TTF_B64) {
    try { pdfDoc.registerFontkit(window.fontkit); hebFont = await pdfDoc.embedFont(b64ToBytes(window.HEBREW_FONT_TTF_B64)); } catch (e) { hebFont = null; }
  }

  const drawValueAt = (pos, text, font, gap) => {
    const displayText = font === hebFont ? layoutRtlText1301(String(text)) : String(text);

  const placeAt = async (label, occurrence, text, font, gap) => {
    if (!text) return false;
    const positions = await findFieldPositionsOnPage(pdfjsDoc, 0, label);
    if (positions.length <= occurrence) return false;
    drawValueAt(positions[occurrence], text, font, gap);
    return true;

  if (hebFont && (await placeAt('שם הקיבוץ', 0, data.kibbutz.name, hebFont))) filled.push('kibbutz_name'); else skipped.push('kibbutz_name');
