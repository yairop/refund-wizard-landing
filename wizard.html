  // שנייה תחת "ב. פרטי הקיבוץ" (המופע הרלוונטי בפועל למילוי).
  if (await placeAt('מספר תיק', 1, data.kibbutz.fileNumber, checkFont)) filled.push('kibbutz_file_number'); else skipped.push('kibbutz_file_number');
  if (await placeAt('לשנת מס', 0, data.taxYear, checkFont)) filled.push('tax_year'); else skipped.push('tax_year');

  // מיקומים קבועים בעמוד 1 של נספח 1443 (נמדדו ישירות מול הטופס הריק המוטבע —
  // אין כאן חיפוש טקסט חי כי חלק מהתוויות מפוצלות/חוזרות ולא ניתנות לזיהוי חד-משמעי).
  // הערה: שורות "פרטים אישיים" (א) הן תיבות בגובה 56pt שמכילות בפנים שתי שורות —
  // כותרת השדה למעלה (y0≈131.2/207.3) וקו מפריד לפני תיבת הצ'קבוקסים (y=157.6/233.6
  // בהתאמה). הערך עצמו חייב לרדת אל תוך התא, מתחת לכותרת ומעל הקו המפריד — לא
  // על גבי שורת הכותרת עצמה (זה היה הבאג: השם/ת.ז הודפסו מעל התא, לא בתוכו).
  const P0_1443 = {
    // שורת "בן הזוג הרשום" (שם משפחה/שם פרטי/ת.ז) ומצב חברות בקיבוץ שלו
    registeredLastName:  { x: 149, y: fy1301(155.5), size: 8 },
    registeredFirstName: { x: 336, y: fy1301(155.5), size: 8 },
    registeredIdNumber:  { x: 525.8, y: fy1301(155.5), size: 8 },
    registeredMemberCheckbox: { x: 438.25, y: fy1301(171.8) },
    // שורת "בן הזוג" (שם משפחה/שם פרטי/ת.ז) ומצב חברות בקיבוץ שלו
    spouseLastName:  { x: 149, y: fy1301(231.5), size: 8 },
    spouseFirstName: { x: 336, y: fy1301(231.5), size: 8 },
    spouseIdNumber:  { x: 525.8, y: fy1301(231.5), size: 8 },
    spouseMemberCheckbox: { x: 438.25, y: fy1301(247.7) },
    // ג. דיווח הקיבוץ — "קיבוץ מדווח כקיבוץ מתחדש לפי סעיף 60א לפקודה" (הנפוץ ביותר)
    reportModern60aCheckbox: { x: 523.3, y: fy1301(385.7) },
    // ה. הכנסה חייבת מועברת לקיבוץ — שורת "משכר", עמודת "סכום" (רשום מול בן/בת זוג)
    // תיקון: השורה גובהה 20.3 נק' (572.0-592.3 מול הטופס הריק) והתווית "משכר"
    // יושבת במרכזה האנכי (576.3-587.8) — הערך היה ממוקם קרוב מדי לראש השורה
    // (מעל המרכז), ולכן נראה כצף מעל התווית. הוזז מטה לכיוון מרכז/תחתית השורה.
    registeredIncomeSalary: { x: 280, y: fy1301(586), size: 8 },
    spouseIncomeSalary:     { x: 90,  y: fy1301(586), size: 8 },
    registeredIncomeTotal:  { x: 280, y: fy1301(706), size: 8 },
    spouseIncomeTotal:      { x: 90,  y: fy1301(706), size: 8 },
  };
  // ז. הצהרת הנישום (עמ' 2) — תיבה בגובה 31.4pt: כותרות "שם/תאריך/חתימה" בראש
  // התיבה (y0≈382.3), הערך צריך לרדת מתחתן, קרוב לתחתית התיבה (y1=412.6). זה
  // היה הבאג השני: השם/תאריך/חתימה הודפסו מעל התיבה כולה (וגם מעל פסקת ההצהרה).
  const P1_1443 = {
    declarantName: { x: 459, y: fy1301(408) + 2, size: 8 },
    declarantDate: { x: 294.7, y: fy1301(408) + 2, size: 8 },
    declarantSignature: { x: 78, y: fy1301(410) + 2, width: 55, height: 13 },
  };

  const page0 = pdfDoc.getPage(0);
  const drawAt0 = (pos, text, font) => { const w = font.widthOfTextAtSize(String(text), pos.size); page0.drawText(String(text), { x: pos.x - w, y: pos.y, size: pos.size, font, color: window.PDFLib.rgb(0, 0, 0.8) }); };
  const checkAt0 = (pos) => drawCheckMark1301(page0, pos, checkFont);

  const memberIsSpouse = data.kibbutz.memberSpouse === 'spouse';
  const memberPerson = memberIsSpouse ? (data.spouse || {}) : (data.registered || {});
  const memberLabel = memberIsSpouse ? 'spouse' : 'registered';

  if (hebFont && memberPerson.lastName) { drawAt0(P0_1443[memberLabel + 'LastName'], layoutRtlText1301(memberPerson.lastName), hebFont); filled.push(memberLabel + '_last_name'); }
  if (hebFont && memberPerson.firstName) { drawAt0(P0_1443[memberLabel + 'FirstName'], layoutRtlText1301(memberPerson.firstName), hebFont); filled.push(memberLabel + '_first_name'); }
  // ת.ז של בן/בת הזוג החבר/ה בקיבוץ — מודפס ברצף (ולא בתיבות ספרות נפרדות),
  // בהתאם להנחיית המשתמש לגבי טפסי 1301 ("תדפיס אותם באופן רציף... זה מספיק טוב").
  if (memberPerson.id) { drawAt0(P0_1443[memberLabel + 'IdNumber'], memberPerson.id, checkFont); filled.push(memberLabel + '_id_number'); } else { skipped.push(memberLabel + '_id_number (לא הוזן ת.ז עבור בן/בת הזוג החבר/ה בקיבוץ)'); }
  // "מעמד בקיבוץ: חבר" — ברירת המחדל הנפוצה ביותר; האשף אינו אוסף כרגע פירוט
  // (חבר/תושב/חבר בחופשה/חבר עצמאות כלכלית), יש לוודא ולתקן במידת הצורך.
  checkAt0(P0_1443[memberLabel + 'MemberCheckbox']);
  filled.push(memberLabel + '_status_chever_default');
  // "קיבוץ מדווח כקיבוץ מתחדש לפי סעיף 60א" — ברירת המחדל הנפוצה ביותר (קיבוצים
  // מתחדשים); יש לוודא מול הקיבוץ בפועל אם הדיווח שונה (שיתופי/סעיף 60ב).
  checkAt0(P0_1443.reportModern60aCheckbox);
  filled.push('report_type_60a_default');

  // הכנסה חייבת מועברת לקיבוץ — סכום המשכורת/קצבה הכוללת של בן/בת הזוג החבר/ה
  // בקיבוץ (מטפסי 106 שהוזנו עבורו/ה באשף). מספר תיק הניכויים הספציפי אינו נאסף
  // כיום באשף ברמת טופס 106 בודד — יש להשלים ידנית מול האישור.
  const memberIncome = sumForm106(memberPerson.form106s);
  const memberTotalIncome = memberIncome.salary + memberIncome.pension;
  if (memberTotalIncome > 0) {
    drawAt0(P0_1443[memberLabel + 'IncomeSalary'], Math.round(memberTotalIncome).toLocaleString('en-US'), checkFont);
    drawAt0(P0_1443[memberLabel + 'IncomeTotal'], Math.round(memberTotalIncome).toLocaleString('en-US'), checkFont);
    filled.push('kibbutz_transferred_income');
  } else {
    skipped.push('kibbutz_transferred_income (אין הכנסה מטופסי 106 עבור בן/בת הזוג החבר/ה בקיבוץ)');
  }
  skipped.push('deductions_file_number_per_employer (יש למלא ידנית — לא נאסף כיום באשף)');

  // ז. הצהרת הנישום (עמוד 2) — שם, תאריך וחתימה של בן/בת הזוג החבר/ה בקיבוץ,
  // מאותה חתימה שנאספה בשלב החתימה של האשף (חתימת "בן הזוג הרשום"/"בן/בת הזוג").
  if (pdfDoc.getPageCount() > 1) {
    const page1 = pdfDoc.getPage(1);
    const memberFullName = ((memberPerson.firstName || '') + ' ' + (memberPerson.lastName || '')).trim();
    const f1301Doc = (data.signDocs || []).find((d) => d.key === 'f1301');
    const signer = f1301Doc && f1301Doc.signers.find((s) => (s.role === 'spouse') === memberIsSpouse);
    if (hebFont && memberFullName) {
      const w = hebFont.widthOfTextAtSize(layoutRtlText1301(memberFullName), P1_1443.declarantName.size);
      page1.drawText(layoutRtlText1301(memberFullName), { x: P1_1443.declarantName.x - w, y: P1_1443.declarantName.y, size: P1_1443.declarantName.size, font: hebFont, color: window.PDFLib.rgb(0, 0, 0.8) });
      filled.push('declarant_name');
    }
    if (signer && signer.signatureDataUrl) {
      const img = await embedSignaturePng(pdfDoc, signer.signatureDataUrl);
      if (img) {
        page1.drawImage(img, { x: P1_1443.declarantSignature.x, y: P1_1443.declarantSignature.y, width: P1_1443.declarantSignature.width, height: P1_1443.declarantSignature.height });
        filled.push('declarant_signature');
        if (signer.signedAt) {
          const dateOnly = String(signer.signedAt).split('·')[0].trim();
          const w2 = checkFont.widthOfTextAtSize(dateOnly, P1_1443.declarantDate.size);
          page1.drawText(dateOnly, { x: P1_1443.declarantDate.x - w2, y: P1_1443.declarantDate.y, size: P1_1443.declarantDate.size, font: checkFont, color: window.PDFLib.rgb(0, 0, 0.8) });
          filled.push('declarant_date');
        }
      } else { skipped.push('declarant_signature'); }
    } else {
      skipped.push('declarant_signature (טרם נחתם באשף)');
    }
  }

  return { bytes: await pdfDoc.save(), filled, skipped };
}

// נספח ד (טופס 1324) — הכנסות מחו"ל ומס ששולם עליהן. ממלא כרגע רק את השורה
// שהאשף כן מחשב נתון עבורה בביטחון: "דיבידנד והכנסות אחרות — מס בשיעור 25%"
// (שדות 431/462) — מס ששולם בחו"ל וזוכה, וסך ההכנסה מדיבידנד ב-25% משני בני
// הזוג. שאר השורות (ריבית מחו"ל, שכר עבודה בחו"ל וכו') דורשות נתונים שהאשף לא
// אוסף כיום, ונשארות ריקות למילוי ידני.
async function fillForm1324(data) {
  const filled = [], skipped = [];
  const templateBytes = b64ToBytes(window.BLANK_FORM_1324_B64);
  const values = computeFormValues(data);
  const { reg, sp, needsSpouse } = getRefundBreakdown(data);
  const foreignCredit25 = Math.round((reg.securities.dividendForeignCredit || 0) + (needsSpouse ? (sp.securities.dividendForeignCredit || 0) : 0));
  // שדה 462 = הכנסת דיבידנד ב-25% שמקורה בפועל בחו"ל בלבד — לא כל הדיבידנד ב-25%
  // (שכולל גם דיבידנד ישראלי, ראו הערה ב-calcSecuritiesForOwner). זה היה באג: קודם
  // חושב כאן "totalDividend25" מכל המקורות יחד, מה שניפח את הסכום ואת תנאי ההצגה.
  const totalDividend25 = Math.round((reg.securities.foreignDividendIncome25 || 0) + (needsSpouse ? (sp.securities.foreignDividendIncome25 || 0) : 0));
  const fieldMap = [];
  if (foreignCredit25 > 0) fieldMap.push([0, '431', 'foreign_credit_25']);
  if (totalDividend25 > 0) fieldMap.push([0, '462', 'total_dividend_25']);
  const r = await fillPdfTemplate(templateBytes, fieldMap, { foreign_credit_25: foreignCredit25, total_dividend_25: totalDividend25 },
    (pdfDoc, font, pdfjsDoc) => fillForm1324Extras(pdfDoc, pdfjsDoc, data));
  filled.push(...r.filled);
  if (!fieldMap.length) skipped.push('foreign_income (לא נמצאו נתוני הכנסה/מס זר מדיבידנד 25% בנתונים שהוזנו — יש למלא ידנית אם קיימת הכנסה מחו"ל אחרת)');
  skipped.push('other_foreign_income_rows (שכר עבודה בחו"ל, ריבית בחו"ל וכו׳ — לא נאספים כיום באשף)', ...r.skipped);
  return { bytes: r.bytes, filled, skipped };
}

// כותרת עמ' 1 (ת.ז/שם/מספר תיק — "שנת המס" כבר מודפסת קבועה בטופס) + חתימת
// הנישום ותאריך בעמ' 2. מיקומי הכותרת נמדדו ישירות מול הטופס הריק (שורה
// 185.6-215.1, תווית בראש השורה - אותו דפוס כמו טבלת "פרטים אישיים" ב-1301/1443).
async function fillForm1324Extras(pdfDoc, pdfjsDoc, data) {
  const filled = [], skipped = [];
  const checkFont = await pdfDoc.embedFont(window.PDFLib.StandardFonts.Helvetica);
  let hebFont = null;
  if (window.fontkit && window.HEBREW_FONT_TTF_B64) {
    try { pdfDoc.registerFontkit(window.fontkit); hebFont = await pdfDoc.embedFont(b64ToBytes(window.HEBREW_FONT_TTF_B64)); } catch (e) { hebFont = null; }
  }
  const page0 = pdfDoc.getPage(0);
  const drawAt = (page, x, y, text, font, gap) => {
    const displayText = font === hebFont ? layoutRtlText1301(String(text)) : String(text);
    const size = 8;
    const width = font.widthOfTextAtSize(displayText, size);
    page.drawText(displayText, { x: x - (gap || 2) - width, y, size, font, color: window.PDFLib.rgb(0, 0, 0.8) });
  };
  const reg = data.registered || {};
  if (reg.id) { drawAt(page0, 267.8, fy1301(207), reg.id, checkFont); filled.push('id_number'); } else skipped.push('id_number');
  if (reg.lastName && hebFont) { drawAt(page0, 385.5, fy1301(207), reg.lastName, hebFont); filled.push('last_name'); }
  if (reg.firstName && hebFont) { drawAt(page0, 506.4, fy1301(207), reg.firstName, hebFont); filled.push('first_name'); }
  if (reg.mainFileNumber) { drawAt(page0, 156.9, fy1301(207), reg.mainFileNumber, checkFont); filled.push('file_number'); } else skipped.push('file_number');

  // חתימת הנישום + תאריך — עמ' 2 (index 1). "תווית חתימת הנישום"/"תאריך" נמצאות
  // בשורה אחת (y≈684.4 בטופס הריק); אין שדה "שם" נפרד לנישום באותה שורה (יש רק
  // "שם המסייע/ת" — שדה של עורך/מייצג מקצועי, לא נוגעים בו).
  if (pdfDoc.getPageCount() > 1 && pdfjsDoc) {
    const page1 = pdfDoc.getPage(1);
    const sigPositions = await findLabelPositionsContaining(pdfjsDoc, 1, 'חתימת');
    const datePositions = await findLabelPositionsContaining(pdfjsDoc, 1, 'תאריך');
    const f1301Doc = (data.signDocs || []).find((d) => d.key === 'f1301');
    const signer = (f1301Doc && f1301Doc.signers.find((s) => s.role === 'registered')) || null;
    if (signer && signer.signatureDataUrl && sigPositions.length) {
      const img = await embedSignaturePng(pdfDoc, signer.signatureDataUrl);
      if (img) {
        const spot = sigPositions[0];
        page1.drawImage(img, { x: spot.x, y: spot.y + 12, width: 55, height: 16 });
        filled.push('signature');
        if (signer.signedAt && datePositions.length) {
          const dateOnly = String(signer.signedAt).split('·')[0].trim();
          drawAt(page1, datePositions[0].x, datePositions[0].y + 12, dateOnly, checkFont);
          filled.push('signature_date');
        }
      } else { skipped.push('signature'); }
    } else {
      skipped.push('signature (טרם נחתם דו"ח 1301 באשף)');
    }

    // הצהרה (עמ' 2): "קיבלתי...החזר מסים...בגין שנות המס הקודמות — כן/לא". האשף
    // אינו אוסף כרגע מידע על החזרי מס זרים משנים קודמות, ולכן מסמן כברירת מחדל
    // "לא" (התשובה הנפוצה) — יש לתקן ידנית אם קיים בפועל החזר כזה. מיקום תיבת
    // הסימון נמדד ישירות מול הטופס הריק (עמ' 2).
    const declFont = await pdfDoc.embedFont(window.PDFLib.StandardFonts.Helvetica);
    drawCheckMark1301(page1, { x: 280.35, y: fy1301(606) }, declFont);
    filled.push('foreign_refund_declaration_no_default');
  }
  return { filled, skipped };
}

// עמוד 1 בנספח ג (1322) — מה שלא ניתן למפות לפי קוד שדה בלבד: שם הבנקים בסעיף ב'
// (מספרי חשבון/סניף אינם נאספים כיום באשף — פער נתונים, לא מיושרים), הסכום
// המועבר לשדות 055/141/157/067/060 בטופס 1301 (טבלת העזר), הפסד להעברה, וחתימה.
async function fillForm1322Extras(pdfDoc, pdfjsDoc, data) {
  const filled = [], skipped = [];
  const page0 = pdfDoc.getPage(0);
  const checkFont = await pdfDoc.embedFont(window.PDFLib.StandardFonts.Helvetica);
  let hebFont = null;
  if (window.fontkit && window.HEBREW_FONT_TTF_B64) {
    try { pdfDoc.registerFontkit(window.fontkit); hebFont = await pdfDoc.embedFont(b64ToBytes(window.HEBREW_FONT_TTF_B64)); } catch (e) { hebFont = null; }
  }
  const values = computeFormValues(data);

  // maxWidth (אופציונלי): אם הטקסט לא נכנס ברוחב הזה בגודל הרגיל, מקטינים את
  // הגופן בהדרגה (עד מינ' 5.5) — נדרש לשמות בנק ארוכים (למשל "בנק מזרחי טפחות
  // בע"מ") שבלי זה חופפים לעמודה השכנה (מספר הסניף) בסעיף ב' בנספח ג.
  const drawEndingAt = (page, pos, text, font, gap, maxWidth) => {
    const displayText = font === hebFont ? layoutRtlText1301(String(text)) : String(text);
    let size = 9;
    let width = font.widthOfTextAtSize(displayText, size);
    if (maxWidth) {
      while (width > maxWidth && size > 5.5) { size -= 0.5; width = font.widthOfTextAtSize(displayText, size); }
    }
    page.drawText(displayText, { x: pos.x - (gap || 3) - width, y: pos.y, size, font, color: window.PDFLib.rgb(0, 0, 0.8) });
  };
  const placeNearLabel = async (label, occurrence, text, font, gap) => {
    if (!text) return false;
    const positions = await findFieldPositionsOnPage(pdfjsDoc, 0, label);
    if (positions.length <= occurrence) return false;
    drawEndingAt(page0, positions[occurrence], text, font, gap);
    return true;
  };

  // ב. פרטי חשבונות הבנק — שם המנכה + מספר סניף + מספר חשבון, לכל אישור. הטבלה
  // בפועל בנויה משני "בלוקים" זהים זה לצד זה (ימני/שמאלי), וכל בלוק מכיל 2 שורות
  // (עד 4 אישורים בסה"כ) — נמדד ישירות מול הטופס הריק (לא ניתן לאתר בחיפוש טקסט
  // כי אין תווית ייחודית לכל שורה בנפרד, רק כותרת אחת משותפת לכל בלוק).
  const certs = data.securities || [];
  const SECTION_B_SLOTS = [
    { bank: { x: 536, y: fy1301(258) }, branch: { x: 460, y: fy1301(258) }, account: { x: 384, y: fy1301(258) } }, // ימני, שורה 1
    { bank: { x: 536, y: fy1301(284) }, branch: { x: 460, y: fy1301(284) }, account: { x: 384, y: fy1301(284) } }, // ימני, שורה 2
    { bank: { x: 282, y: fy1301(258) }, branch: { x: 204, y: fy1301(258) }, account: { x: 137, y: fy1301(258) } }, // שמאלי, שורה 1
    { bank: { x: 282, y: fy1301(284) }, branch: { x: 204, y: fy1301(284) }, account: { x: 137, y: fy1301(284) } }, // שמאלי, שורה 2
  ];
  certs.slice(0, SECTION_B_SLOTS.length).forEach((cert, i) => {
    const slot = SECTION_B_SLOTS[i];
    if (cert.bankName && hebFont) { drawEndingAt(page0, slot.bank, cert.bankName, hebFont, null, 74); filled.push('bank_name_' + (i + 1)); }
    if (cert.branchCode) { drawEndingAt(page0, slot.branch, cert.branchCode, checkFont); filled.push('branch_code_' + (i + 1)); }
    if (cert.accountNumber) { drawEndingAt(page0, slot.account, cert.accountNumber, checkFont); filled.push('account_number_' + (i + 1)); }
    if (!cert.branchCode || !cert.accountNumber) skipped.push('bank_branch_or_account_' + (i + 1) + ' (חסר בנתוני האישור — יש להשלים ידנית)');
  });
  if (certs.length > SECTION_B_SLOTS.length) skipped.push('bank_names_overflow (יותר מ-4 אישורי בנק — הטופס תומך רק ב-4, יש להשלים ידנית)');

  // טבלת עזר לקיזוז יתרת הפסד — שורה 1 ("הכנסה מריבית ודיבידנד מניירות ערך" לפי
  // שיעור, ברוטו). שורה 2 ("קיזוז הפסד הון שוטף...") ותיבת "העברה לשדות" למטה —
  // לפי הנחיית המשתמש בפירוש — מוצגות עם סכום ההפסד שקוזז בגין רווחי הון (אותו
  // ערך כמו שורה 2 בסעיף ג', ר' capgain_loss_offset_25 ב-computeFormValues),
  // ולא סכום הכנסת ריבית/דיבידנד עצמה. שתי השורות לא ניתנות לחיפוש טקסט חד-משמעי
  // (תוויות מפוצלות למספר מילים) — נמדדו ידנית מול הטופס הריק לשנת 2025.
  const { reg: __r, sp: __s, needsSpouse: __ns } = getRefundBreakdown(data);
  const incomeByRate = (r) => Math.round(
    ((__r.securities.dividendsByRate[r] || 0) + (__r.securities.interestByRate[r] || 0)) +
    (__ns ? ((__s.securities.dividendsByRate[r] || 0) + (__s.securities.interestByRate[r] || 0)) : 0)
  );
  const HELPER_ROW1_Y = fy1301(580) + 2;
  const HELPER_ROW2_Y = fy1301(608) + 2;
  const HELPER_ROW_X = { 30: 87, 25: 161, 20: 235, 15: 309 };
  const capgainOffsetByRate = { 30: values.capgain_loss_offset_30, 25: values.capgain_loss_offset_25, 20: values.capgain_loss_offset_20, 15: values.capgain_loss_offset_15 };
  let helperRow1Any = false, helperRow2Any = false;
  [30, 25, 20, 15].forEach((r) => {
    const amt = incomeByRate(r);
    if (amt > 0) {
      drawEndingAt(page0, { x: HELPER_ROW_X[r], y: HELPER_ROW1_Y }, amt, checkFont);
      filled.push('helper_table_income_' + r); helperRow1Any = true;
    }
    const offAmt = capgainOffsetByRate[r];
    if (offAmt > 0) {
      drawEndingAt(page0, { x: HELPER_ROW_X[r], y: HELPER_ROW2_Y }, offAmt, checkFont);
      filled.push('helper_table_offset_' + r); helperRow2Any = true;
    }
  });
  if (!helperRow1Any) skipped.push('helper_table_row1 (אין הכנסת ריבית/דיבידנד מני"ע בשיעורים אלה)');
  if (!helperRow2Any) skipped.push('helper_table_row2 (לא קוזז הפסד כנגד רווח הון בשיעורים אלה)');
  skipped.push('helper_table_row3 (קיזוז הפסד שנוצר עד 31.12.05 — האשף לא מפריד בין הפסד "שוטף" לבין הפסד "עד 2005"; כל הקיזוז מיוחס לשורה 2)');

  // הסכום המועבר לשדות 055/141/157/067/060 בטופס 1301 — לפי הנחיית המשתמש, אותו
  // סכום כמו שורה 2 בסעיף ג'/שורה 2 בטבלת העזר (טור 25%): סכום ההפסד שקוזז בגין
  // רווחי הון. ממוקם תחת טור ה-25% ולא ליד ה-x של התווית עצמה.
  // תיקון: pdf.js מאחד את כל השורה "העברה לשדות 055/141/157/067/060" לפריט טקסט
  // אחד — placeNearLabel (המבוסס על התאמה מדויקת) לא מצא כלום. חיפוש לפי הכלה
  // רק כדי לאתר את שורת התווית (y), ומציירים תחת טור 25% ולא ליד ה-x שלה.
  const transferOffset25 = values.capgain_loss_offset_25;
  const transferLabelPositions = await findLabelPositionsContaining(pdfjsDoc, 0, '055/141/157/067/060');
  if (transferOffset25 > 0 && transferLabelPositions.length) {
    drawEndingAt(page0, { x: HELPER_ROW_X[25], y: transferLabelPositions[0].y }, transferOffset25, checkFont);
    filled.push('interest_dividend_25_transfer');
  } else skipped.push('interest_dividend_25_transfer');

  // הפסדים להעברה מניירות ערך לשנה הבאה.
  const placeNearLabelContains = async (label, occurrence, text, font, gap) => {
    if (!text) return false;
    const positions = await findLabelPositionsContaining(pdfjsDoc, 0, label);
    if (positions.length <= occurrence) return false;
    drawEndingAt(page0, positions[occurrence], text, font, gap);
    return true;
  };
  if (await placeNearLabelContains('להעברה', 0, values.securities_loss_carryforward, checkFont)) filled.push('loss_carryforward'); else skipped.push('loss_carryforward');

  // חתימה + שם + תאריך — מהחתימה שנאספה בשלב החתימה של האשף (מסמך 867/1322 חתום
  // ע"י "בן הזוג הרשום"). תיקון: הוזזו מעלה בכ-12 נק' (שורה אחת) — המשתמש דיווח
  // שהשם/תאריך נדפסו שורה אחת נמוך מדי (על גבי שורת התווית עצמה, כי לא הופעל
  // היסט y כמו בשאר השדות בקובץ הזה).
  const ROW_UP = 12;
  const positions = await findFieldPositionsOnPage(pdfjsDoc, 0, 'חתימה');
  const namePositions = await findFieldPositionsOnPage(pdfjsDoc, 0, 'שם');
  const datePositions = await findFieldPositionsOnPage(pdfjsDoc, 0, 'תאריך');
  const f867Doc = (data.signDocs || []).find((d) => d.key === 'f867');
  const signer = f867Doc && f867Doc.signers[0];
  if (signer && signer.signatureDataUrl && positions.length) {
    const img = await embedSignaturePng(pdfDoc, signer.signatureDataUrl);
    if (img) {
      const spot = positions[0];
      page0.drawImage(img, { x: spot.x, y: spot.y + ROW_UP, width: 60, height: 18 });
      filled.push('signature');
      const fullName = ((data.registered.firstName || '') + ' ' + (data.registered.lastName || '')).trim();
      if (hebFont && fullName && namePositions.length) { drawEndingAt(page0, { x: namePositions[0].x, y: namePositions[0].y + ROW_UP }, fullName, hebFont); filled.push('signer_name'); }
      if (signer.signedAt && datePositions.length) {
        const dateOnly = String(signer.signedAt).split('·')[0].trim();
        drawEndingAt(page0, { x: datePositions[0].x, y: datePositions[0].y + ROW_UP }, dateOnly, checkFont);
        filled.push('signature_date');
      }
    } else { skipped.push('signature'); }
  } else {
    skipped.push('signature (טרם נחתם דו"ח 867 באשף)');
  }

  return { filled, skipped };
}

// נקודת הכניסה שהכפתור בשלב 7 קורא לה: ממלא את הטפסים (1301, 1322, ובמידת הצורך
// נספח 1443) ומחזיר אותם כ-Blob-ים מוכנים לשמירה, יחד עם דוח קצר על אילו שדות
// מולאו/דולגו (לשקיפות מול המשתמש).
async function fillOfficialFormPdfs(data) {
  if (!window.PDFLib) throw new Error('ספריית מילוי ה-PDF (pdf-lib) לא נטענה — יש לוודא חיבור לאינטרנט בהעלאה הראשונה ולנסות שוב.');
  if (!window.BLANK_FORM_1301_B64_BY_YEAR || !window.BLANK_FORM_1322_B64_BY_YEAR) throw new Error('קובץ הטפסים הריקים (form_templates_data.js) לא נמצא באותה תיקייה כמו קובץ האשף.');
  const t1301 = pickTemplateForYear(window.BLANK_FORM_1301_B64_BY_YEAR, data.taxYear);
  const t1322 = pickTemplateForYear(window.BLANK_FORM_1322_B64_BY_YEAR, data.taxYear);
  if (!t1301 || !t1322) throw new Error('לא נמצא טופס ריק מוטבע (1301/1322) לאף שנת מס.');

  const values = computeFormValues(data);
  const label = (data.registered.firstName + ' ' + data.registered.lastName + ' ' + data.taxYear).trim() || ('דוח ' + data.taxYear);
  const r1301 = await fillPdfTemplate(b64ToBytes(t1301.b64), PDF_FIELD_MAP_1301, values,
    (pdfDoc) => fillPage0PersonalDetails(pdfDoc, data));
  const r1322 = await fillPdfTemplate(b64ToBytes(t1322.b64), PDF_FIELD_MAP_1322, values,
    (pdfDoc, font, pdfjsDoc) => fillForm1322Extras(pdfDoc, pdfjsDoc, data));
  if (t1301.isFallback) r1301.skipped.push('(!) לא נמצא טופס 1301 ריק לשנת מס ' + data.taxYear + ' — נעשה שימוש בטופס של שנת ' + t1301.usedYear + ' בתור הקרוב ביותר. יש לבדוק היטב את מספרי השדות מול הטופס הרשמי לשנה המבוקשת לפני הגשה.');
  if (t1322.isFallback) r1322.skipped.push('(!) לא נמצא נספח ג (1322) ריק לשנת מס ' + data.taxYear + ' — נעשה שימוש בטופס של שנת ' + t1322.usedYear + '.');

  const files = [
    { name: 'טופס 1301 ממולא - ' + label + '.pdf', bytes: r1301.bytes },
    { name: 'נספח ג (1322) ממולא - ' + label + '.pdf', bytes: r1322.bytes },
  ];
  let filledCount = r1301.filled.length + r1322.filled.length;
  let skipped = [...r1301.skipped, ...r1322.skipped];

  if (data.kibbutz && data.kibbutz.isMember) {
    if (window.BLANK_FORM_1443_B64) {
      const r1443 = await fillForm1443(data);
      files.push({ name: 'נספח 1443 - דיווח חבר-תושב קיבוץ ממולא - ' + label + '.pdf', bytes: r1443.bytes });
      filledCount += r1443.filled.length;
      skipped = skipped.concat(r1443.skipped);
    } else {
      skipped.push('נספח 1443 (חבר קיבוץ) — קובץ הטופס הריק לא נמצא');
    }
  }

  // נספח ד (1324) — מוצג רק כאשר יש בפועל נתוני מס זר על דיבידנד ב-25% (השורה
  // היחידה שהאשף כן ממלא כרגע). אם המשתמש/ת צריכים לדווח הכנסות חו"ל אחרות
  // (ריבית/שכר), הטופס לא יופק אוטומטית — יש למלא אותו ידנית מהאתר הרשמי.
  if (window.BLANK_FORM_1324_B64) {
    const { reg, sp, needsSpouse } = getRefundBreakdown(data);
    const hasForeignDividendData = (reg.securities.dividendForeignCredit || 0) > 0 || (needsSpouse && (sp.securities.dividendForeignCredit || 0) > 0);
    if (hasForeignDividendData) {
      const r1324 = await fillForm1324(data);
      files.push({ name: 'נספח ד (1324) - הכנסות מחול ממולא חלקית - ' + label + '.pdf', bytes: r1324.bytes });
      filledCount += r1324.filled.length;
      skipped = skipped.concat(r1324.skipped);
    }
  }

  return { files, filledCount, skipped };
}
window.fillOfficialFormPdfs = fillOfficialFormPdfs;

function extraDocsList(data) {
  const label = (data.registered.firstName + ' ' + data.registered.lastName + ' ' + data.taxYear).trim() || ('דוח ' + data.taxYear);
  return [
    { name: 'נתונים למילוי - טופס 1301 ונספח ג.html', html: buildFieldMappingHtml(data) },
    { name: 'רשימת מסמכים להגשה.html', html: buildChecklistHtml(data) },
    { name: label + '.json', html: buildPythonDataJson(data) },
  ];
}

// מנקה תווים שאסורים בשם קובץ ב-Windows/File System Access API (כולל גרשיים " —
// שמופיעים בקיצורים עבריים נפוצים כמו מחו"ל/חו"ל וגורמים ל-getFileHandle להיכשל
// עם השגיאה "Name is not allowed").
function sanitizeFileName(name) {
  return String(name).replace(/[\\/:*?"<>|]/g, '-');
}

// כל הקבצים שנשמרים בסוף התהליך (בתיקייה שנבחרה, או ב-ZIP כגיבוי כשאין תמיכת
// דפדפן בבחירת תיקייה) מקבלים רישא של מספר הזהות של בן/בת הזוג הרשום/ה בתחילת
// שם הקובץ — כדי שכל קובץ יזוהה בבירור לאיזה תיק/לקוח הוא שייך. שדה זה תמיד
// מלא בשלב הזה, כי מסך ההזדהות (שלב 0) חוסם המשך בלי ת.ז. — ראו הוולידציה
// ב-Step0Identity (missingFields).
function resolveIdPrefix(data) {
  return String((data && data.registered && data.registered.id) || '').trim();
}

function withIdPrefix(fileName, idPrefix) {
  return sanitizeFileName(idPrefix + ' - ' + fileName);
}

// pdfFiles: מערך אופציונלי של {name, bytes} — טפסי 1301/1322 שמולאו אוטומטית
// (ראו fillOfficialFormPdfs) — נשמרים לצד שאר המסמכים הטקסטואליים.
async function saveDocsToFolder(docs, data, dirHandle, pdfFiles) {
  const idPrefix = resolveIdPrefix(data);
  for (const doc of docs) {
    const html = buildDocHtml(doc, data);
    const safeName = withIdPrefix(doc.label + '.html', idPrefix);
    const fileHandle = await dirHandle.getFileHandle(safeName, { create: true });
    const writable = await fileHandle.createWritable();
    await writable.write(html);
    await writable.close();
  }
  for (const extra of extraDocsList(data)) {
    const fileHandle = await dirHandle.getFileHandle(withIdPrefix(extra.name, idPrefix), { create: true });
    const writable = await fileHandle.createWritable();
    await writable.write(extra.html);
    await writable.close();
  }
  for (const pdf of (pdfFiles || [])) {
    const fileHandle = await dirHandle.getFileHandle(withIdPrefix(pdf.name, idPrefix), { create: true });
    const writable = await fileHandle.createWritable();
    await writable.write(pdf.bytes);
    await writable.close();
  }
}

async function saveDocsAsZip(docs, data, pdfFiles) {
  const zip = new window.JSZip();
  const idPrefix = resolveIdPrefix(data);
  docs.forEach((doc) => {
    const safeName = withIdPrefix(doc.label + '.html', idPrefix);
    zip.file(safeName, buildDocHtml(doc, data));
  });
  extraDocsList(data).forEach((extra) => { zip.file(withIdPrefix(extra.name, idPrefix), extra.html); });
  (pdfFiles || []).forEach((pdf) => { zip.file(withIdPrefix(pdf.name, idPrefix), pdf.bytes); });
  const blob = await zip.generateAsync({ type: 'blob' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'טפסים חתומים - אשף החזרי מס.zip';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function Step7SignSave({ data, setData, onBack }) {
  const { Button, Alert } = window.YairDesignSystem_29a38a;
  const [phase, setPhase] = React.useState('review');
  const docs = data.signDocs;
  const allSigned = docs.length > 0 && docs.every((d) => d.signers.every((s) => s.signed));

  const [dirHandle, setDirHandle] = React.useState(null);
  const [folderName, setFolderName] = React.useState(data.saveFolderName || '');
  const [saving, setSaving] = React.useState(false);
  const [saveError, setSaveError] = React.useState('');
  const [savedMessage, setSavedMessage] = React.useState('');
  const fsSupported = typeof window.showDirectoryPicker === 'function';

  const signSigner = (docIdx, signerIdx, dataUrl) => {
    const stamp = new Date().toLocaleDateString('he-IL') + ' · ' + new Date().toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
    const next = docs.map((d, di) => di !== docIdx ? d : {
      ...d,
      signers: d.signers.map((s, si) => si !== signerIdx ? s : { ...s, signed: true, signatureDataUrl: dataUrl, signedAt: stamp }),
    });
    setData({ ...data, signDocs: next });
  };

  const pickFolder = async () => {
    try {
      const handle = await window.showDirectoryPicker({ mode: 'readwrite' });
      setDirHandle(handle);
      setFolderName(handle.name);
      setSaveError('');
    } catch (e) {
      if (e && e.name !== 'AbortError') setSaveError('לא ניתן היה לבחור תיקייה: ' + e.message);
    }
  };

  // מילוי טופס 1301 ונספח ג הרשמיים בפועל — קורה אוטומטית בלחיצה על "שמירת הטפסים
  // החתומים" (למטה), בלי כפתור נפרד ובלי שום התקנה/הרצה של פייתון. אם המילוי נכשל
  // מסיבה כלשהי (למשל קובץ הטפסים הריקים חסר), שאר הקבצים עדיין נשמרים כרגיל —
  // ומוצגת על כך הודעה ברורה, לשם שקיפות מלאה למשתמש.
  const [fillReport, setFillReport] = React.useState(null); // { filledCount, skipped } | { error }

  const doSave = async () => {
    setSaving(true);
    setSaveError('');
    setFillReport(null);
    let pdfFiles = [];
    try {
      const result = await fillOfficialFormPdfs(data);
      pdfFiles = result.files;
      setFillReport({ filledCount: result.filledCount, skipped: result.skipped });
    } catch (e) {
      setFillReport({ error: e && e.message ? e.message : String(e) });
    }
    try {
      if (fsSupported && dirHandle) {
        await saveDocsToFolder(docs, data, dirHandle, pdfFiles);
        setSavedMessage('כל הטפסים החתומים' + (pdfFiles.length ? ', טופס 1301 ונספח ג הממולאים' : '') + ', טבלת ההתאמה לשדות הרשמיים ורשימת המסמכים נשמרו בתיקייה: ' + folderName);
      } else {
        await saveDocsAsZip(docs, data, pdfFiles);
        setSavedMessage('הדפדפן שלכם אינו תומך בבחירת תיקייה ישירה — קובץ ZIP עם כל הטפסים החתומים' + (pdfFiles.length ? ', טופס 1301 ונספח ג הממולאים' : '') + ', טבלת ההתאמה לשדות ורשימת המסמכים ירד לתיקיית ההורדות שלכם.');
      }
      setData((d) => ({ ...d, saved: true, saveFolderName: folderName }));
    } catch (e) {
      setSaveError('אירעה שגיאה בשמירת הקבצים: ' + e.message);
    } finally {
      setSaving(false);
    }
  };

  if (phase === 'review') {
    const { reg, sp, needsSpouse } = getRefundBreakdown(data);
    return (
      <StepShell title="סקירת הטפסים המלאים" subtitle="בדקו את נתוני המס שחושבו לפני המעבר לחתימה"
        footer={<React.Fragment><Button variant="secondary" onClick={onBack}>חזרה</Button><Button variant="primary" onClick={() => setPhase('sign')}>המשך לחתימה</Button></React.Fragment>}>
        <RefundBanner data={data} />
        <ReviewCard title="טופס 1301 — דוח ליחיד" rows={[
          ['שנת מס', data.taxYear], ['אל', data.taxOffice],
          ['שם', `${data.registered.firstName} ${data.registered.lastName}`], ['ת.ז.', data.registered.id],
          ['כתובת מגורים', data.form1301.residentialAddress], ['כתובת למשלוח דואר', data.form1301.mailingAddress],
          ['הדוח על', data.form1301.reportBasis === 'both' ? 'הכנסותי והכנסות בן/בת זוגי' : 'הכנסותי בלבד'],
          ['משכורת — בן/בת הזוג הרשום/ה (שדה 172)', fmtILS(reg.salary.income)],
          ...(needsSpouse ? [['משכורת — בן/בת הזוג (שדה 158)', fmtILS(sp.salary.income)]] : []),
          ['הכנסה מני״ע (ר"ה נספח ג)', fmtILS(reg.securities.totalIncome + (needsSpouse ? sp.securities.totalIncome : 0))],
          ['מחזור מכירות ני״ע (שדה 256)', fmtILS(reg.securities.turnover + (needsSpouse ? sp.securities.turnover : 0))],
          ['ניכוי במקור ממשכורת (שדה 042)', fmtILS(reg.salary.withheld + (needsSpouse ? sp.salary.withheld : 0))],
          ['ניכוי במקור מני״ע (שדה 040)', fmtILS(reg.securities.totalWithheld + (needsSpouse ? sp.securities.totalWithheld : 0))],
          ['מס לתשלום (מחושב)', fmtILS(reg.owed)], ['החזר משוער', fmtILS(reg.refund)],
          ...(needsSpouse ? [['החזר משוער — בן/בת הזוג', fmtILS(sp.refund)]] : []),
        ]} />
        {data.kibbutz.isMember && (
          <ReviewCard title="נספח 1443 — דיווח חבר/תושב קיבוץ" rows={[
            ['שם קיבוץ', data.kibbutz.name], ['מספר תיק', data.kibbutz.fileNumber],
            ['מתייחס ל', data.kibbutz.memberSpouse === 'registered' ? 'בן/בת הזוג הרשום/ה' : 'בן/בת הזוג'],
          ]} />
        )}
        <ReviewCard title='דו"ח 867 — אישורי ניכוי מס במקור' rows={[
          ['מספר אישורי בנק', String(data.securities.length)],
          ['הכנסה מניירות ערך', fmtILS(reg.securities.totalIncome + (needsSpouse ? sp.securities.totalIncome : 0))],
          ['מס שנוכה במקור', fmtILS(reg.securities.totalWithheld + (needsSpouse ? sp.securities.totalWithheld : 0))],
          ['הפרש לזיכוי מניירות ערך', fmtILS(reg.securities.refund + (needsSpouse ? sp.securities.refund : 0))],
        ]} />
      </StepShell>
    );
  }

  return (
    <StepShell title="חתימה ושמירה" subtitle={allSigned ? 'כל המסמכים נחתמו' : 'חתמו על כל מסמך; טפסים מסוימים דורשים חתימת שני בני הזוג'}
      footer={<React.Fragment><Button variant="secondary" onClick={() => setPhase('review')}>חזרה לסקירה</Button><span /></React.Fragment>}>
      {docs.map((d, di) => (
        <div key={d.key} style={{ marginBottom: 26 }}>
          <div style={{ fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: 15, color: 'var(--text-primary)', marginBottom: 10 }}>{d.label}</div>
          <DocumentPreview docKey={d.key} data={data} />
          {d.signers.map((s, si) => (
            <SignRow key={s.role} signer={s} onSign={(dataUrl) => signSigner(di, si, dataUrl)} />
          ))}
        </div>
      ))}
      {!allSigned && <Alert tone="warning" title="נותרו חתימות" description="יש להשלים את כל החתימות הנדרשות לפני שמירת הטפסים." />}
      {allSigned && (
        <React.Fragment>
          <div style={{ height: 8 }} />
          <Field label="לאן לשמור את הטפסים החתומים?">
            <div style={{ display: 'flex', gap: 10, alignItems: 'center', flexWrap: 'wrap' }}>
              <Button variant="secondary" onClick={pickFolder}>{folderName ? 'שינוי תיקייה' : 'בחירת תיקייה במחשב'}</Button>
              {folderName && <span style={{ fontSize: 13, color: 'var(--text-secondary)' }}>נבחרה תיקייה: <b>{folderName}</b></span>}
            </div>
            {!fsSupported && <div style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 6 }}>הדפדפן שלכם אינו תומך בבחירת תיקייה ישירה — הקבצים יורדו לתיקיית ההורדות כקובץ ZIP.</div>}
          </Field>
          <div style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 6 }}>הלחיצה על "שמירת הטפסים החתומים" למטה גם ממלאת אוטומטית את טופס 1301 ונספח ג הרשמיים בסכומים המחושבים, ושומרת אותם יחד עם שאר הקבצים — בלי צורך בפייתון או בהתקנה כלשהי.</div>
          <div style={{ height: 16 }} />
          <Button variant="primary" onClick={doSave} disabled={saving || (fsSupported && !dirHandle)}>{saving ? 'ממלא ושומר…' : 'מילוי טפסי PDF ושמירת הכול'}</Button>
          {saveError && <div style={{ marginTop: 16 }}><Alert tone="error" title="שגיאה בשמירה" description={saveError} /></div>}
          {fillReport && fillReport.error && <div style={{ marginTop: 16 }}><Alert tone="warning" title="טפסי ה-PDF לא מולאו אוטומטית" description={fillReport.error + ' — שאר הקבצים נשמרו כרגיל; ניתן למלא את הטפסים ידנית לפי "נתונים למילוי" שבחבילה.'} /></div>}
          {fillReport && !fillReport.error && (
            <div style={{ marginTop: 16 }}>
              <Alert tone={fillReport.skipped.length ? 'warning' : 'success'} title={'טופס 1301 ונספח ג מולאו אוטומטית — ' + fillReport.filledCount + ' שדות'}
                description={fillReport.skipped.length ? 'לא אותרו/דולגו שדות: ' + fillReport.skipped.join(', ') + ' — יש להשלים אותם ידנית מול הטופס. בכל מקרה יש לבדוק כל שדה מול המסמך המקורי לפני הגשה.' : 'יש עדיין לבדוק כל שדה מול המסמך המקורי לפני הגשה — זהו כלי עזר בלבד.'} />
            </div>
          )}
          {data.saved && !saveError && <div style={{ marginTop: 16 }}><Alert tone="success" title="הושלם" description={savedMessage} /></div>}
        </React.Fragment>
      )}
    </StepShell>
  );
}
window.Step7SignSave = Step7SignSave;


const STEP_LABELS = ['הזדהות', 'פרטים אישיים', 'קיבוץ', 'אישורי בנק', 'טופס 1301', 'השלמת פרטים', 'חתימה ושמירה'];

function emptyPerson() { return { id:'', lastName:'', firstName:'', fatherName:'', dob:'', email:'', phone:'', annualIncome:'', taxWithheld:'', creditPoints:'2.25', form106s:[] }; }

function App(){
  const [step, setStep] = React.useState(0);
  const [data, setData] = React.useState({
    taxYear: '2025',
    taxOffice: 'משרד השומה',
    maritalStatus: 'married',
    registered: { ...emptyPerson(), mainOccupation:'', businessName:'', businessAddress:'', mainFileNumber:'', employerNames:'', bankAccount:'', branchCode:'', bankCode:'', accountHolderName:'' },
    spouse: { ...emptyPerson(), employerName:'' },
    kibbutz: { isMember: false, name:'', fileNumber:'', memberSpouse:'registered' },
    bankDocs: [],
    securities: [],
    form1301: { residentialAddress:'', mailingAddress:'', reportBasis:'own' },
    saveFolderName: '',
    signDocs: [],
    saved: false,
  });

  React.useEffect(() => {
    if (step === 6) {
      const regName = `${data.registered.firstName} ${data.registered.lastName}`.trim() || 'בן/בת הזוג הרשום/ה';
      const spName = `${data.spouse.firstName} ${data.spouse.lastName}`.trim() || 'בן/בת הזוג';
      const needsSpouseOn1301 = data.form1301.reportBasis === 'both' && data.maritalStatus === 'married';
      const docs = [{
        key: 'f1301', label: 'טופס 1301 — דוח ליחיד',
        signers: [
          { role: 'registered', name: regName, roleLabel: 'בן/בת הזוג הרשום/ה', signed: false, signatureDataUrl: null, signedAt: null },
          ...(needsSpouseOn1301 ? [{ role: 'spouse', name: spName, roleLabel: 'בן/בת הזוג', signed: false, signatureDataUrl: null, signedAt: null }] : []),
        ],
      }];
      if (data.kibbutz.isMember) {
        const isSpouseMember = data.kibbutz.memberSpouse === 'spouse';
        docs.push({
          key: 'kibbutz', label: 'נספח 1443 — דיווח חבר/תושב קיבוץ',
          signers: [{ role: isSpouseMember ? 'spouse' : 'registered', name: isSpouseMember ? spName : regName, roleLabel: isSpouseMember ? 'בן/בת הזוג' : 'בן/בת הזוג הרשום/ה', signed: false, signatureDataUrl: null, signedAt: null }],
        });
      }
      docs.push({
        key: 'f867', label: 'דו"ח 867 — אישורי ניכוי מס במקור',
        signers: [{ role: 'registered', name: regName, roleLabel: 'בן/בת הזוג הרשום/ה', signed: false, signatureDataUrl: null, signedAt: null }],
      });
      setData((d) => ({ ...d, signDocs: d.signDocs.length ? d.signDocs : docs }));
    }
  }, [step]);

  const next = () => setStep((s) => Math.min(s + 1, STEP_LABELS.length - 1));
  const back = () => setStep((s) => Math.max(s - 1, 0));

  const screens = [
    <Step0Identity data={data} setData={setData} onNext={next} />,
    <Step2PersonalDetails data={data} setData={setData} onNext={next} onBack={back} />,
    <Step3Kibbutz data={data} setData={setData} onNext={next} onBack={back} />,
    <Step4BankDocs data={data} setData={setData} onNext={next} onBack={back} />,
    <Step5Form1301 data={data} setData={setData} onNext={next} onBack={back} />,
    <Step6CompleteMissing data={data} setData={setData} onNext={next} onBack={back} />,
    <Step7SignSave data={data} setData={setData} onBack={back} />,
  ];

  return (<React.Fragment><Stepper steps={STEP_LABELS} current={step} />{screens[step]}</React.Fragment>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

</script>
</body>
</html>
